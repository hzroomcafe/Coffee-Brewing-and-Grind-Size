function GrindTool({ lang, t, c, myGrinder }) {
  const classes = useClasses(c);
  const { GRINDER_DATABASE } = useDatabases(lang);
  const [grinderA, setGrinderA] = useState('');const [grinderB, setGrinderB] = useState(myGrinder || '');const [valA, setValA] = useState('');
  const [redClix, setRedClix] = useState(false);
  const [customMinUm, setCustomMinUm] = useState('');
  const [customMaxUm, setCustomMaxUm] = useState('');   // 自定義顆粒粗細度範圍（μm，選填，兩格可相同）
  // 沖煮類別的 μm 邊界（近似值，供自訂範圍比對用）
  const CAT_UM_BOUNDS = [[0,300],[300,500],[500,800],[800,1200],[1200,99999]];
  const customActive = customMinUm !== '' || customMaxUm !== '';
  const customRange = useMemo(() => {
    if (!customActive) return null;
    let mn = parseFloat(customMinUm), mx = parseFloat(customMaxUm);
    if (isNaN(mn) && isNaN(mx)) return null;
    if (isNaN(mn)) mn = mx; if (isNaN(mx)) mx = mn;
    if (mn > mx) { const tmp = mn; mn = mx; mx = tmp; }
    return { mn, mx };
  }, [customMinUm, customMaxUm, customActive]);
  // 自訂範圍重疊到的沖煮類別（可能不只一個）
  const customCatIndices = useMemo(() => {
    if (!customRange) return [];
    const idxs = [];
    CAT_UM_BOUNDS.forEach(([lo, hi], idx) => { if (customRange.mx >= lo && customRange.mn < hi) idxs.push(idx); });
    return idxs;
  }, [customRange]);
  const showRedClix = grinderA === 'm_c40' || grinderB === 'm_c40';
  const gdb = useMemo(() => {
    if (!redClix || !GRINDER_DATABASE['m_c40']) return GRINDER_DATABASE;
    const base = GRINDER_DATABASE['m_c40'];
    return { ...GRINDER_DATABASE, m_c40: { ...base,
      unit: base.unit + ' · Red Clix',
      ranges: base.ranges.map((r) => ({ min: r.min === null ? null : r.min * 2, max: r.max === null ? null : r.max * 2 })) } };
  }, [redClix, GRINDER_DATABASE]);
  // 自訂範圍 → 目標磨豆機的建議刻度範圍（線性內插，需在 gdb 宣告之後）
  const customTargetRange = useMemo(() => {
    if (!customRange || !grinderB || !gdb[grinderB] || customCatIndices.length === 0) return null;
    let outMin = Infinity, outMax = -Infinity;
    customCatIndices.forEach((idx) => {

      const gLo = gRange.min + fracLo * (gRange.max - gRange.min);

  }, [customRange, grinderB, gdb, customCatIndices]);
  const groups = useMemo(() => {
    let grps = {};
    Object.entries(GRINDER_DATABASE).forEach(([key, g]) => {
      if (!grps[g.group]) grps[g.group] = [];
      grps[g.group].push({ key, name: g.name });

    const gA = gdb[grinderA];const gB = gdb[grinderB];const parsedA = parseFloat(valA);

    const rFirst = gA.ranges.find((r) => r.min !== null);const rLast = [...gA.ranges].reverse().find((r) => r.max !== null);
    if (parsedA < rFirst.min) return { error: `${t('err_low')} ${rFirst.min})`, catIdx: -1 };

    let catIdx = -1;let ratio = 0;

    let valB = rB.min + ratio * (rB.max - rB.min);

};

function BrewDiagnostics({ lang, t, c }) {
  const l = (zh, en, ja) => ({ zh, en, ja })[lang] || zh;
  const classes = useClasses(c);
  const isDark = c.isDark;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ===== Brewing Setup =====
  const [dripper, setDripper] = useState('v60');
  const [paper, setPaper] = useState('standard');
  const [grindUm, setGrindUm] = useState(750);
  const [temp, setTemp] = useState(92);
  const [grounds, setGrounds] = useState('15');
  const [ratio, setRatio] = useState(15);
  const [mm, setMm] = useState('2');
  const [ss, setSs] = useState('30');
  const [waterMin, setWaterMin] = useState(150);

  // ===== Measurement =====
  const [mode, setMode] = useState('sensory');
  const [tdsInput, setTdsInput] = useState(1.35);

  // 6 sensory dimensions (1-10)
  const [sAcidity, setSAcidity] = useState(6);
  const [sBitter, setSBitter] = useState(4);
  const [sSweet, setSSweet] = useState(7);
  const [sBody, setSBody] = useState(6);
  const [sAstr, setSAstr] = useState(3);
  const [sAfter, setSAfter] = useState(7);

  // ===== Derived =====
  const gN = parseFloat(grounds) || 0;
  const waterN = gN * ratio;
  const totalSec = (parseInt(mm, 10) || 0) * 60 + (parseInt(ss, 10) || 0);
  const isValid = gN > 0 && ratio > 0 && totalSec > 0;

  // Dripper physical params: LRR g water absorbed per g grounds, drawdown factor
  const dripperMap = {
    v60: { lrr: 1.95, df: 1.00, name: 'Hario V60' },
    kalita: { lrr: 2.00, df: 1.25, name: 'Kalita Wave' },
    origami: { lrr: 1.95, df: 0.90, name: 'Origami' },
    swi: { lrr: 2.10, df: 1.85, name: 'Hario Switch' },
    chemex: { lrr: 1.90, df: 1.15, name: 'Chemex' }
  };
  const dInfo = dripperMap[dripper];
  const paperF = { fast: 0.80, standard: 1.00, slow: 1.35 }[paper];
  const tempF = 1 + (92 - temp) * 0.005;
  const expectedSec = isValid ? 130 * dInfo.df * paperF * Math.pow(gN / 15, 1.2) * Math.pow(750 / grindUm, 1.6) * tempF : 0;
  const dev = expectedSec > 0 ? totalSec / expectedSec : 1;
  const expMin = Math.floor(expectedSec / 60);
  const expSec = Math.round(expectedSec % 60);
  const fmtTime = (m, s) => `${m}:${String(s).padStart(2, '0')}`;

  // Water mineralization influence
  let waterBoost = 0;
  if (waterMin < 30) waterBoost = -0.6;else
  if (waterMin < 70) waterBoost = -0.25;else
  if (waterMin > 250) waterBoost = -0.4;else
  if (waterMin >= 100 && waterMin <= 175) waterBoost = 0.15;

  // EY / TDS
  let ey = 20,tdsCalc = 1.30;
  if (isValid) {
    if (mode === 'refract') {
      const bev = waterN - gN * dInfo.lrr;
      ey = bev > 0 ? tdsInput * bev / gN : 0;
      tdsCalc = tdsInput;
    } else {
      // Physical baseline
      let pEY = 20 + (800 - grindUm) * 0.012 + (temp - 92) * 0.22 + (dev - 1) * 3.5 + waterBoost;
      // Sensory inference
      let sEY = 20;
      sEY += (sBitter - 4) * 0.7;
      sEY += (sAstr - 3) * 0.7;
      sEY += (sAfter - 6) * 0.35;
      if (sSweet < 6) sEY -= (sAcidity - 6) * 0.5;
      sEY += (sSweet - 7) * 0.25;
      ey = clamp(0.45 * pEY + 0.55 * sEY, 12, 26);
      const bev = waterN - gN * dInfo.lrr;
      tdsCalc = bev > 0 ? clamp(ey * gN / bev + (sBody - 6) * 0.04, 0.6, 2.1) : 1.30;
    }
  }
  ey = clamp(ey, 12, 26);
  tdsCalc = clamp(tdsCalc, 0.6, 2.1);

  // ===== Diagnosis =====
  const sigChannel = mode === 'sensory' && sAstr >= 6 && sBitter >= 6 && sAcidity >= 7;
  const sigClog = dev > 1.30 && (mode === 'sensory' ? sAstr >= 5 : ey > 21);
  const sigBypass = dev < 0.75 && tdsCalc < 1.15;
  const sigOver = ey > 22 || mode === 'sensory' && sBitter >= 7 && sAstr >= 5;
  const sigUnder = ey < 18 || mode === 'sensory' && sAcidity >= 7 && sSweet < 6 && sBody < 6;
  const sigWeak = tdsCalc < 1.15 && !sigUnder && !sigBypass;
  const sigStrong = tdsCalc > 1.45 && !sigOver;

  const actualTimeStr = fmtTime(parseInt(mm, 10) || 0, parseInt(ss, 10) || 0);
  const expTimeStr = fmtTime(expMin, expSec);

  let badge,title,summary,sensoryText,actions = [];

  if (!isValid) {
    badge = l('待輸入', 'WAITING', '入力待ち');
    title = l('請完成輸入', 'Complete the inputs', '入力を完了してください');
    summary = l('請輸入完整的粉量、粉水比與沖煮時間。', 'Enter dose, brew ratio and time.', '粉量・比率・時間を入力してください。');
    sensoryText = '';
  } else if (sigChannel) {
    badge = l('通道效應', 'CHANNELING', 'チャネリング');
    title = l('粉床偏流 ── 通道效應', 'Channeling — uneven extraction', 'チャネリング');
    summary = l(
      `酸感、苦感、澀感同時偏高，這是典型的「通道效應」：水流避開粉床密實處，從脆弱處貫穿，導致局部過萃，其餘區域萃取不足。`,
      `Sour, bitter and astringent all high — classic channeling. Water bypasses denser bed and rushes through weak spots.`,
      `酸味と苦み・渋みが同時に高いのは典型的なチャネリングです。`
    );
    sensoryText = l('感官線索：尖酸 + 澀苦同時出現，乾淨度低。', 'Cue: sour + bitter + astringent together; low cleanliness.', '酸+苦+渋が同時、クリーンさ低下。');
    actions = [
    l('改善佈水均勻度：避免衝擊濾紙邊緣，採螺旋式注水或中心緩注。', 'Pour more evenly: avoid hitting filter edges, use spiral pour.', '注湯を均一に：縁を直撃せず、らせん状に。'),
    l(`研磨從 ${grindUm} μm 調粗至 ${grindUm + 80} μm，並嘗試 WDT 攪拌器以減少結團與細粉。`, `Coarsen to ${grindUm + 80} μm and try a WDT tool to break clumps.`, `挽き目を${grindUm + 80} μmへ。WDTでダマと微粉を整える。`),
    l('延長悶蒸至 35-40 秒，確保整層粉床完全潤濕並排出 CO₂。', 'Extend bloom to 35-40s for full saturation and CO₂ release.', '蒸らしを35-40秒に延長。')];

  } else if (sigClog) {
    badge = l('細粉堵塞', 'FINES CLOGGED', '微粉詰まり');

  { key: 'brew', icon: Thermometer, nav: 'nav_brew' },
  { key: 'grind', icon: Wrench, nav: 'nav_grind' },
  { key: 'water', icon: Droplets, nav: 'nav_water' },
  { key: 'diag', icon: Crosshair, nav: 'nav_diag' }];

const parseHash = () => {
  const h = (window.location.hash || '').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const tool = ['home', 'brew', 'grind', 'water', 'diag'].includes(parts[0]) ? parts[0] : 'home';
  return { tool, recipe: tool === 'brew' && parts[1] ? parts[1] : null, go: tool === 'brew' && parts[2] === 'go' };
};
const routeHash = (r) => '#/' + r.tool + (r.tool === 'brew' && r.recipe ? '/' + encodeURIComponent(r.recipe) + (r.go ? '/go' : '') : '');

function ToolHead({ tool, t }) {
  const meta = { grind: ['tool_grind_title', 'tool_grind_desc', Wrench], water: ['tool_water_title', 'tool_water_desc', Droplets], diag: ['tool_diag_title', 'tool_diag_desc', Crosshair] }[tool];
  if (!meta) return null;
  const Icon = meta[2];
  return (
    <div className="ck-head ck-donly">
      <div className={`ck-tile ${tool}`}><Icon size={22} /></div>
      <div><h1>{t(meta[0])}</h1><p>{t(meta[1])}</p></div>
    </div>);
}


// ---------- 首頁：工具總覽＋介紹（打開網站的第一頁） ----------
function HomeView({ t, lang, store, navigate }) {
  const db = useDatabases(lang);
  const dinfo = useDripperInfo(db.DRIPPER_CATEGORIES, lang);
  const byId = useMemo(() => { const m = {}; db.RECIPE_DATABASE.forEach((r) => { m[r.id] = r; }); return m; }, [db]);
  const recents = store.recent.filter((x) => byId[x.id]).slice(0, 3);
  const [showLog, setShowLog] = useState(false);
  const h = new Date().getHours();
  const greet = t(h < 6 ? 'greet_dawn' : h < 11 ? 'greet_morning' : h < 14 ? 'greet_noon' : h < 18 ? 'greet_afternoon' : 'greet_evening');
  const nRecipes = db.RECIPE_DATABASE.length;
  const nDrippers = new Set(db.RECIPE_DATABASE.map((r) => r.dripper)).size;
  const nGrinders = Object.keys(db.GRINDER_DATABASE).length;
  const log = t('changelog');
  const openRecent = (x) => { BREW_UI.list = recents.map((y) => y.id); BREW_UI.dose = x.dose || null; navigate({ tool: 'brew', recipe: x.id }); };
  const small = [
    ['grind', Wrench, 'tool_grind_title', 'tool_grind_desc', fmt(t('home_meta_grind'), { n: nGrinders })],
    ['water', Droplets, 'tool_water_title', 'tool_water_desc', 'Aquacode · NAIRO · APAX'],
    ['diag', Crosshair, 'tool_diag_title', 'tool_diag_desc', 'SCA Golden Cup']];
  return (
    <div className="ck-home">
      <div className="ck-hero2">
        <div className="kick">{greet} · Coffee Toolkit</div>
        <h1>{t('home_question_pre')}<span>{t('home_question_main')}</span></h1>
        <p>{t('home_subtitle')}</p>
      </div>

      {recents.length > 0 &&
      <section style={{ marginBottom: 22 }}>
          <div className="ck-cap"><Clock size={14} />{t('recent')}</div>
          <div className="ck-cards">{recents.map((x) => { const r = byId[x.id]; return <RecipeCard key={x.id} r={r} d={dinfo.byId[r.dripper]} sub={relTime(x.at, t)} fav={store.favs.includes(r.id)} onFav={store.toggleFav} onOpen={() => openRecent(x)} t={t} />; })}</div>
        </section>
      }

      <a href="#/brew" className="ck-tool big">
        <div className="ck-tile brew" style={{ width: 56, height: 56, borderRadius: 16 }}><Thermometer size={26} /></div>
        <div style={{ minWidth: 0, flex: 1 }}>
          <h2>{t('tool_brew_title')}</h2>
          <p>{t('tool_brew_desc')}</p>
          <div className="meta">{fmt(t('home_meta_brew'), { n: nRecipes, d: nDrippers })}</div>
          <span className="cta">{t('home_cta_brew')} <ChevronRight size={16} /></span>
        </div>
        <span className="no">01</span>
      </a>

      <div className="ck-tools3">
        {small.map(([k, Icon, ti, de, meta], i) =>
        <a key={k} href={'#/' + k} className="ck-tool">
            <div className={`ck-tile ${k}`}><Icon size={21} /></div>
            <div style={{ minWidth: 0, flex: 1 }}>
              <h2>{t(ti)}</h2>
              <p>{t(de)}</p>
              <div className="meta">{meta}</div>
            </div>
            <span className="no">0{i + 2}</span>
          </a>
        )}
      </div>

      <a href={CAFE_URL} className="ck-tool" style={{ marginTop: 14 }}>
        <div className="ck-tile cafe"><MapPin size={21} /></div>
        <div style={{ minWidth: 0, flex: 1 }}>
          <h2 style={{ display: 'flex', alignItems: 'center', gap: 6 }}>{t('tool_cafe_title')}<ArrowUpRight size={15} style={{ color: 'var(--faint)' }} /></h2>
          <p>{t('tool_cafe_desc')}</p>
        </div>
        <span className="no">05</span>
      </a>

      {Array.isArray(log) &&
      <div style={{ marginTop: 30 }}>
          <button className="ck-logbtn" onClick={() => setShowLog((v) => !v)} aria-expanded={showLog}>
            <span className="ln"></span><Clock size={13} />{t('changelog_title')} · {log[0] && log[0].version}<ChevronDown size={14} style={{ transform: showLog ? 'rotate(180deg)' : '' }} /><span className="ln"></span>
          </button>
          {showLog &&
        <div className="ck-card" style={{ padding: '20px 22px 8px', marginTop: 12 }}>
              {log.map((g, i) =>
          <div key={i} className={`ck-log ${i === 0 ? 'first' : ''}`}>
                  <b>{g.version}</b><small>{g.date}</small>
                  <ul>{g.changes.map((x, j) => <li key={j}>{x}</li>)}</ul>
                </div>
          )}
            </div>
        }
        </div>
      }
    </div>);
}

function SettingsSheet({ t, lang, setLang, themeMode, setThemeMode, store, focus, onClose }) {
  const db = useDatabases(lang);
  const dinfo = useDripperInfo(db.DRIPPER_CATEGORIES, lang);
  const { gear, setGear, myGrinder, setMyGrinder } = store;
  const [showLog, setShowLog] = useState(focus === 'log');
  const gearRef = useRef(null);
  useEffect(() => { if (focus === 'gear' && gearRef.current) setTimeout(() => gearRef.current && gearRef.current.scrollIntoView({ block: 'start', behavior: 'smooth' }), 120); }, [focus]);
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  const counts = useMemo(() => { const m = {}; db.RECIPE_DATABASE.forEach((r) => { m[r.dripper] = (m[r.dripper] || 0) + 1; }); return m; }, [db]);
  const grinderGroups = useMemo(() => {
    const g = {}; Object.entries(db.GRINDER_DATABASE).forEach(([k, v]) => { (g[v.group] = g[v.group] || []).push({ k, name: v.name }); });
    Object.values(g).forEach((a) => a.sort((x, y) => x.name.localeCompare(y.name, undefined, { numeric: true, sensitivity: 'base' })));
    return g;
  }, [db]);
  const log = t('changelog');
  return ReactDOM.createPortal(
    <React.Fragment>
      <div className="ck-scrim" onClick={onClose}></div>
      <div className="ck-sheet side" role="dialog" aria-label={t('settings')}>
        <div className="grab"></div>
        <div className="ck-sheet-h"><h2>{t('settings')}</h2><button className="ck-icb" onClick={onClose} aria-label={t('summary_close')}><XIcon size={17} /></button></div>
        <div className="ck-sheet-b">
          <div className="ck-set-sec">
            <h3>{t('lang_label')}</h3>
            <div className="ck-seg wide">{[['zh', '中文'], ['en', 'English'], ['ja', '日本語']].map(([k, lb]) => <button key={k} className={lang === k ? 'on' : ''} onClick={() => setLang(k)}>{lb}</button>)}</div>
          </div>
          <div className="ck-set-sec">
            <h3>{t('theme_label')}</h3>
            <div className="ck-seg wide">{[['light', t('theme_light'), Sun], ['dark', t('theme_dark'), Moon], ['system', t('theme_system'), null]].map(([k, lb, Ic]) => <button key={k} className={themeMode === k ? 'on' : ''} onClick={() => setThemeMode(k)} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>{Ic && <Ic size={14} />}{lb}</button>)}</div>
          </div>
          <div className="ck-set-sec" ref={gearRef}>
            <h3>{t('my_gear')}{gear.length > 0 && <span style={{ color: 'var(--faint)', marginLeft: 6 }}>{gear.length}</span>}{gear.length > 0 && <button className="ck-cap act" style={{ float: 'right', margin: 0 }} onClick={() => setGear([])}>{t('clear')}</button>}</h3>
            <p>{t('my_gear_hint')}</p>
            {dinfo.cats.map((cat) =>
            <div key={cat.label}>
                <div className="ck-cap" style={{ marginTop: 10, marginBottom: 2 }}><span className={`ck-dot ${cat.cat}`}></span>{cat.label}</div>
                {cat.items.map((d) => <CheckRow key={d.id} on={gear.includes(d.id)} name={d.name} count={counts[d.id] || 0} onClick={() => setGear(gear.includes(d.id) ? gear.filter((x) => x !== d.id) : [...gear, d.id])} />)}
              </div>
            )}
            <div className="ck-cap" style={{ marginTop: 18, marginBottom: 6 }}>{t('my_grinder_label')}</div>
            <p style={{ marginTop: 0 }}>{t('my_grinder_hint')}</p>
            <select className="ck-select" value={myGrinder} onChange={(e) => setMyGrinder(e.target.value)} aria-label={t('my_grinder_label')}>
              <option value="">{t('my_grinder_none')}</option>
              {Object.entries(grinderGroups).map(([g, arr]) => <optgroup key={g} label={g}>{arr.map((x) => <option key={x.k} value={x.k}>{x.name}</option>)}</optgroup>)}
            </select>
          </div>
          <div className="ck-set-sec">
            <button className="ck-dr" style={{ padding: '4px 0', fontSize: 13, fontWeight: 800, color: 'var(--mute)' }} onClick={() => setShowLog((v) => !v)}>
              <span className="nm">{t('changelog_short')}{Array.isArray(log) && log[0] ? ` · ${log[0].version}` : ''}</span><ChevronDown size={16} style={{ transform: showLog ? 'rotate(180deg)' : '' }} />
            </button>
            {showLog && Array.isArray(log) &&
            <div style={{ marginTop: 12, paddingLeft: 4 }}>
                {log.map((g, i) =>
              <div key={i} className={`ck-log ${i === 0 ? 'first' : ''}`}>
                    <b>{g.version}</b><small>{g.date}</small>
                    <ul>{g.changes.map((x, j) => <li key={j}>{x}</li>)}</ul>
                  </div>
              )}
              </div>
            }
          </div>
        </div>
      </div>
    </React.Fragment>, document.body);
}

function App() {
  // 舊版分享連結 ?d=&r=&g= 仍可用：讀進來後改成新的 #/brew/<配方>
  const legacy = useMemo(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      const r = p.get('r'); if (!r) return null;
      return { recipe: r, g: p.get('g') };
    } catch (e) { return null; }
  }, []);
  const [route, setRoute] = useState(() => legacy ? { tool: 'brew', recipe: legacy.recipe, go: false } : parseHash());
  useEffect(() => {
    if (legacy) { try { history.replaceState(null, '', window.location.pathname + routeHash({ tool: 'brew', recipe: legacy.recipe })); } catch (e) {} }
    const onHash = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const navigate = (r, replace) => {
    const h = routeHash(r);
    if (replace) { try { history.replaceState(null, '', h); } catch (e) {} setRoute(parseHash()); } else
    if (window.location.hash !== h) window.location.hash = h;
  };

  const [lang, setLang] = useStored('coffee_lang', 'zh');
  const L = i18n[lang] ? lang : 'zh';
  const t = (k) => i18n[L][k] != null ? i18n[L][k] : i18n.zh[k] != null ? i18n.zh[k] : k;
  useEffect(() => { document.documentElement.lang = L === 'zh' ? 'zh-Hant' : L; }, [L]);

  // 外觀：淺色／深色／跟隨系統（沿用舊版 coffee_theme 與 coffee_theme_manual 兩個 key）
  const sysDark = useMedia('(prefers-color-scheme: dark)');
  const [themeMode, setThemeMode0] = useState(() => { try { if (localStorage.getItem('coffee_theme_manual')) { const s = localStorage.getItem('coffee_theme'); if (s === 'dark' || s === 'light') return s; } } catch (e) {} return 'system'; });
  const setThemeMode = (m) => {
    setThemeMode0(m);
    try { if (m === 'system') { localStorage.removeItem('coffee_theme_manual'); localStorage.removeItem('coffee_theme'); } else { localStorage.setItem('coffee_theme_manual', '1'); localStorage.setItem('coffee_theme', m); } } catch (e) {}
  };
  const isDark = themeMode === 'system' ? sysDark : themeMode === 'dark';
  const toggleDark = () => setThemeMode(isDark ? 'light' : 'dark');
  const c = getColors(isDark);
  useLayoutEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);

  // 個人資料：最愛、最近沖過、我的器材、我的磨豆機（只存在這台裝置的瀏覽器）
  const [favs, setFavs] = useStored('coffee_favs', []);
  const [recent, setRecent] = useStored('coffee_recent', []);
  const [gear, setGear] = useStored('coffee_gear', []);
  const [setupDone, setSetupDone] = useStored('coffee_setup_done', false);
  const [myGrinder, setMyGrinder] = useStored('coffee_my_grinder', '');
  const store = {
    favs, gear, setGear, recent, setupDone, setSetupDone, myGrinder, setMyGrinder,
    toggleFav: (id) => setFavs((f) => f.includes(id) ? f.filter((x) => x !== id) : [id, ...f]),
    addRecent: (id, dose) => setRecent((r) => [{ id, at: Date.now(), dose }, ...r.filter((x) => x.id !== id)].slice(0, 12))
  };

  const [settings, setSettings] = useState(null); // null | 'main' | 'gear' | 'log'
  const openSettings = (focus) => setSettings(focus || 'main');

  useEffect(() => { window.scrollTo(0, 0); }, [route.tool]);
  useEffect(() => { document.title = route.tool === 'home' || route.tool === 'brew' ? t('app_title') : `${t('nav_' + route.tool)} · ${t('app_title')}`; }, [route.tool, L]);

  const inRecipe = route.tool === 'brew' && !!route.recipe;
  const phoneTitle = t('nav_' + route.tool);

  return (
    <div style={{ minHeight: '100vh' }}>
      {/* 電腦版上方導覽 */}
      <header className="ck-top ck-donly">
        <div className="ck-top-in">
          <a className="ck-logo" href="#/home" aria-label={t('app_title')}><Coffee size={17} /></a>
          <a className="ck-brand" href="#/home">{t('app_short')}</a>
          <nav style={{ display: 'flex', gap: 2 }} aria-label="tools">
            {TOOLS.map(({ key, icon: Icon, nav }) =>
            <a key={key} href={'#/' + key} className={`ck-tab ${key} ${route.tool === key ? 'on' : ''}`} aria-current={route.tool === key ? 'page' : undefined}><Icon size={16} />{t(nav)}</a>
            )}
            <a href={CAFE_URL} className="ck-tab cafe"><MapPin size={16} />{t('nav_cafe')}</a>
          </nav>
          <div style={{ flex: 1 }}></div>
          <div className="ck-seg" role="group" aria-label={t('lang_label')}>{[['zh', '中'], ['en', 'EN'], ['ja', 'JA']].map(([k, lb]) => <button key={k} className={L === k ? 'on' : ''} onClick={() => setLang(k)}>{lb}</button>)}</div>
          <button className="ck-icb" style={{ marginLeft: 8 }} onClick={toggleDark} aria-label={isDark ? t('theme_light') : t('theme_dark')} title={isDark ? t('theme_light') : t('theme_dark')}>{isDark ? <Sun size={16} /> : <Moon size={16} />}</button>
          <button className="ck-icb" style={{ marginLeft: 6 }} onClick={() => openSettings()} aria-label={t('settings')} title={t('settings')}><Sliders size={16} /></button>
        </div>
      </header>

      <main className="ck-main">
        {/* 手機版頁首：大標題＋深淺色＋設定 */}
        {!inRecipe &&
        <div className="ck-ph ck-monly">
            {route.tool === 'home' ? <a href="#/home" className="ck-logo" aria-label={t('app_title')}><Coffee size={17} /></a> : null}
            <h1 style={route.tool === 'home' ? { fontSize: 17 } : undefined}>{route.tool === 'home' ? t('app_short') : phoneTitle}</h1>
            <div style={{ flex: 1 }}></div>
            <button className="ck-icb" onClick={toggleDark} aria-label={isDark ? t('theme_light') : t('theme_dark')}>{isDark ? <Sun size={16} /> : <Moon size={16} />}</button>
            <button className="ck-icb" onClick={() => openSettings()} aria-label={t('settings')}><Sliders size={16} /></button>
          </div>
        }
        <ToolHead tool={route.tool} t={t} />
        {route.tool === 'home' ? <HomeView t={t} lang={L} store={store} navigate={navigate} /> :
        route.tool === 'brew' ? <BrewTool lang={L} t={t} c={c} route={route} navigate={navigate} store={store} openSettings={openSettings} initialDose={legacy && legacy.g} /> :
        route.tool === 'grind' ? <GrindTool lang={L} t={t} c={c} myGrinder={myGrinder} /> :
        route.tool === 'diag' ? <BrewDiagnostics lang={L} t={t} c={c} /> :
        <div style={{ maxWidth: 820 }}><WaterTool lang={L} c={c} t={t} /></div>}
      </main>

      {/* 手機版底部 5 個分頁（配方頁隱藏，改顯示「開始沖煮」） */}
      {!inRecipe &&
      <nav className="ck-bnav ck-monly" aria-label="tools">
          <div className="ck-bnav-in">
            {TOOLS.map(({ key, icon: Icon, nav }) => {
            const on = route.tool === key;
            return <a key={key} href={'#/' + key} className={`${key} ${on ? 'on' : ''}`} aria-current={on ? 'page' : undefined}>{on && <i></i>}<Icon size={21} strokeWidth={on ? 2.4 : 2} />{t(nav)}</a>;
          })}
            <a href={CAFE_URL} className="cafe"><MapPin size={21} />{t('nav_cafe')}</a>
          </div>
        </nav>
      }
      {settings && <SettingsSheet t={t} lang={L} setLang={setLang} themeMode={themeMode} setThemeMode={setThemeMode} store={store} focus={settings} onClose={() => setSettings(null)} />}
    </div>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
