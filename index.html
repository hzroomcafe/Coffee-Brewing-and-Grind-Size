  --water:#6F9A84; --water-soft:#DFEEE5; --water-ink:#2E6A4B;

/* ---------- 外框 ---------- */

.ck-tab:hover { color: var(--ink); background: var(--inset); }
.ck-tab.on { color: #fff; }

.ck-tab.on.home { background: var(--sage); } .ck-tab.on.brew { background: var(--brew-ink); } .ck-tab.on.grind { background: var(--grind-ink); } .ck-tab.on.water { background: var(--water-ink); } .ck-tab.on.diag { background: var(--diag-ink); } .ck-tab.on.cafe { background: var(--cafe-ink); }

.ck-icb { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--input); color: var(--mute); flex: none; cursor: pointer; transition: color .15s, border-color .15s; }
.ck-icb:hover { color: var(--ink); border-color: var(--line2); }

.ck-bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: color-mix(in srgb, var(--card) 96%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: max(env(safe-area-inset-bottom), 6px); }
.ck-bnav-in { display: grid; grid-template-columns: repeat(6, 1fr); height: 58px; }

/* ---------- 元件 ---------- */
.ck-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.ck-cap { font-size: 12.5px; font-weight: 800; color: var(--mute); letter-spacing: .04em; display: flex; align-items: center; gap: 7px; margin: 0 0 10px; }
.ck-cap .n { font-weight: 700; color: var(--faint); }

.ck-badge i { width: 7px; height: 7px; border-radius: 50%; flex: none; }

.ck-chip:hover { color: var(--ink); }

.ck-chip.box.on { background: var(--sage); border-color: var(--sage); color: var(--on-sage); }
.ck-chip .ct { font-weight: 800; opacity: .7; }
.ck-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 12px 18px; font-size: 15px; font-weight: 800; border: 1px solid var(--line); background: var(--input); color: var(--ink); cursor: pointer; transition: transform .1s, opacity .15s; }
.ck-btn:active { transform: scale(.98); }

.ck-btn.sage { background: var(--sage); color: var(--on-sage); border-color: var(--sage); }

.ck-btn.ghost { background: transparent; }

/* ---------- 沖煮清單 ---------- */

function useHold() {
  const timer = useRef(null);
  const start = (fn) => {
    fn();
    let delay = 350;
    const tick = () => { fn(); delay = Math.max(40, delay * 0.8); timer.current = setTimeout(tick, delay); };
    timer.current = setTimeout(tick, delay);
  };
  const stop = () => { if (timer.current) { clearTimeout(timer.current); timer.current = null; } };
  useEffect(() => stop, []);
  return { start, stop };
}

// localStorage 小工具：所有讀寫都包 try/catch，私密模式下也不會壞掉
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function useStored(key, init) {
  const [v, setV] = useState(() => LS.get(key, init));
  useEffect(() => { LS.set(key, v); }, [key, v]);
  return [v, setV];
}

      baseGrind: { grinder: 'm_c40', val: 42 },

      description: l(
        '世界冠軍粕谷哲為 HARIO V60 NEO 設計的「10投式」新配方，將總水量 300g 分為 10 次、每次 30g 注入，讓熱水不滯留於濾杯、順順落下，把淺焙的透明感與潛力發揮到極致。\n\n適用豆種：超級適合淺焙咖啡。淺焙豆通常風味豐富但口感較薄，此配方能完美補足口感；高溫與多段注水可能不太適合深焙咖啡。影片中示範使用厄瓜多 Cruz Loma 莊園 Servio 藝伎咖啡豆。\n\n▶ 影片教學：https://www.youtube.com/watch?v=k0nsShguOsU',

    {
      id: 'neo-keyaki-matsuki', name: l('KEYAKI 雙溫 Switch 法', 'KEYAKI Dual-Temp Switch', 'KEYAKI 二段温度スイッチ'), author: 'Yusuke Matsuki · KEYAKI COFFEE', dripper: 'Hario V60 NEO', drinkType: 'hot', baseCoffee: 14, temperature: 90,
      baseGrind: { grinder: 'm_c40', val: 20 },
      description: l('HARIO 官方「Barista\'s Recommended Recipe」，KEYAKI COFFEE 松木佑介的配方。V60 NEO 01 搭配 Switch 浸泡式底座（只用底座），總時間約 2 分鐘。\n\n利用 Switch 在悶蒸階段讓整個粉層浸泡，避免萃取不均；第 2 段以高溫帶出風味與甜感，第 3 段關閉開關並降溫，用浸泡帶出口感厚度、同時保持乾淨。開關要在還沒過萃的時間點打開，杯子會比較平衡。\n\n💡 沖煮備註：\n1. 需搭配 Switch 浸泡式底座。\n2. 濾紙：メテオペーパー（Meteor）。\n3. 水溫：第 1、2 段 90°C，第 3 段 60°C。\n4. 研磨度：中細研磨，C40 約 20 格（換算參考）。\n5. 示範豆子：Bolivia Las Alasitas Geisha Natural。', 'From HARIO\'s official "Barista\'s Recommended Recipe" series, by Yusuke Matsuki of KEYAKI COFFEE. V60 NEO 01 on a Switch immersion base (base only), about 2 minutes total.\n\nThe Switch lets the whole bed steep during the bloom to avoid uneven extraction. The second pour uses high heat for flavour and sweetness; the third closes the valve at a lower temperature to build body through immersion while staying clean. Open the valve before it over-extracts for a balanced cup.\n\n💡 Notes:\n1. Requires a Switch immersion base.\n2. Filter: Meteor paper.\n3. Water: 90°C for pours 1–2, 60°C for pour 3.\n4. Grind: medium-fine, ~C40 20 (conversion reference).\n5. Beans used: Bolivia Las Alasitas Geisha Natural.', 'HARIO公式「Barista\'s Recommended Recipe」より、KEYAKI COFFEE 松木佑介さんのレシピ。V60 NEO 01＋浸漬式ドリッパー スイッチ（ホルダーのみ）、総抽出時間約2分。\n\nスイッチを使い蒸らしの段階で粉全体を浸漬させ、抽出ムラを防ぎます。2投目は高い湯温でフレーバーや甘みを引き出し、3投目はスイッチを閉じて湯温を下げ、浸漬させることで質感を出しながらもクリーンな味わいに。過抽出にならないタイミングでスイッチを開くと、バランスの良い一杯に。\n\n💡 メモ:\n1. スイッチのホルダーが必要。\n2. ペーパー: メテオペーパー。\n3. 湯温: 1・2投目90℃、3投目60℃。\n4. 挽き目: 中細挽き、C40 約20（換算の目安）。\n5. 使用豆: Bolivia Las Alasitas Geisha Natural。'),
      steps: [
      rs('km1', '0:00-0:40', bClose, (r) => l(`關閉開關，90°C 注水至 ${Math.round(60 * r)}g`, `Close valve, 90°C to ${Math.round(60 * r)}g`, `スイッチを閉じ、90℃で${Math.round(60 * r)}gまで`), 60),

    {
      id: 'neo-onibus-sakao', name: l('ONIBUS 三段繞圈法', 'ONIBUS 3-Pour Spiral', 'ONIBUS 3投スパイラル'), author: 'Atsushi Sakao · ONIBUS COFFEE', dripper: 'Hario V60 NEO', drinkType: 'hot', baseCoffee: 13.5, temperature: 95,
      baseGrind: { grinder: 'm_c40', val: 24 },
      description: l('HARIO 官方「Barista\'s Recommended Recipe」，ONIBUS COFFEE 坂尾篤史的配方。V60 NEO 01，95°C 高溫，總時間約 2:20–2:40。\n\n讓淺焙的酸味變得協調，保留透明感，同時把甜感拉到最高；特色是風味的延展和餘韻。\n\n💡 沖煮備註：\n1. 第 2、3 段以每秒約 6g 的流速，從中心向外繞圈注滿全體。\n2. 研磨度：中研磨，C40 約 24 格（換算參考）。\n3. 示範豆子：Colombia／Jorge Armando Salazar。', 'From HARIO\'s official "Barista\'s Recommended Recipe" series, by Atsushi Sakao of ONIBUS COFFEE. V60 NEO 01 at 95°C, about 2:20–2:40 total.\n\nHarmonises the acidity of light roasts while keeping clarity and pushing sweetness as far as it goes, with a long, extended finish.\n\n💡 Notes:\n1. Pours 2 and 3 at about 6g per second, spiralling out from the center to cover the whole bed.\n2. Grind: medium, ~C40 24 (conversion reference).\n3. Beans used: Colombia / Jorge Armando Salazar.', 'HARIO公式「Barista\'s Recommended Recipe」より、ONIBUS COFFEE 坂尾篤史さんのレシピ。V60 NEO 01、95℃、総抽出時間約2分20秒〜40秒。\n\n浅煎りコーヒーの酸味と調和させながら、透明感を保ちつつ甘みを最大限に引き出します。フレーバーの伸びと余韻をつくることが特徴です。\n\n💡 メモ:\n1. 2・3投目は6g/秒で中心から円を描いて全体に注ぐ。\n2. 挽き目: 中挽き、C40 約24（換算の目安）。\n3. 使用豆: コロンビア／ホルヘ・アルマンド・サラザール。'),

      rs('os4', '2:20-2:40', dAct, l('滴完', 'Drawdown', '落ちきり'), null)]

      baseGrind: { grinder: 'm_c40', val: 24 },
      description: l('HARIO 官方「Barista\'s Recommended Recipe」，ドトールコーヒー廣田まあさ的配方。V60 NEO 01 搭配 Switch 浸泡式底座（只用底座），83°C，總時間 1:45。\n\n結合 V60 NEO 的流速和 Switch 浸泡的特性，帶出咖啡的甜感和醇厚度。\n\n💡 沖煮備註：\n1. 需搭配 Switch 浸泡式底座。\n2. 研磨度：中研磨，C40 約 24 格（換算參考）。\n3. 示範豆子：神嘗祭（祕魯、巴西中深焙配豆）。', 'From HARIO\'s official "Barista\'s Recommended Recipe" series, by Maasa Hirota of Doutor Coffee. V60 NEO 01 on a Switch immersion base (base only), 83°C, 1:45 total.\n\nCombines the V60 NEO\'s flow with the Switch\'s immersion to draw out sweetness and body.\n\n💡 Notes:\n1. Requires a Switch immersion base.\n2. Grind: medium, ~C40 24 (conversion reference).\n3. Beans used: Kannamesai (Peru / Brazil medium-dark blend).', 'HARIO公式「Barista\'s Recommended Recipe」より、株式会社ドトールコーヒー 廣田まあささんのレシピ。V60 NEO 01＋浸漬式ドリッパー スイッチ（ホルダーのみ）、83℃、総抽出時間1分45秒。\n\nV60 NEOの抽出の速さと、スイッチドリッパーの浸漬式ならではの特徴を組み合わせ、コーヒーの甘みとコクを引き出します。\n\n💡 メモ:\n1. スイッチのホルダーが必要。\n2. 挽き目: 中挽き、C40 約24（換算の目安）。\n3. 使用豆: 神嘗祭（ペルー・ブラジルの中深煎りブレンド）。'),

    {

      baseGrind: { grinder: 'm_c40', val: 20 },
      description: l(
        '專為旅行設計的簡易沖煮法：在外熱水水溫不易控制，直接用飲水機「煮滾即出」的熱水（約 100°C）即可。全程搭配 MELODRIP 萃取器；喝起來若濃度偏高，加點水 bypass 稀釋即可。\n\n淺焙可將研磨度調細一些，請依自己的豆子微調。司令官 C40 約 20 格。',

    { id: 'v60-46', name: '4:6 Method', author: '粕谷哲', dripper: 'Hario V60 02', drinkType: 'hot', baseCoffee: 20, temperature: 90, baseGrind: { grinder: 'm_c40', val: 30 }, description: l('4:6 沖煮法的核心很簡單：把整杯咖啡的總水量分成「前 40%」與「後 60%」兩段。\n\n· 前 40%（分兩投）：控制酸甜風味基調\n· 後 60%（分三投）：控制咖啡濃度\n\n它把風味變成一道可以調整的「數學題」，讓大家在家也更容易沖出穩定、好喝的一杯。\n\n分段技巧：第一投以「粉重的三倍」為基準注水（例：20g 粉 → 60g）。想要酸味更明顯，就增加第一投；想要更甜，就減少第一投——但不管哪個方向，前面兩投加起來都等於前 40% 的水量。後 60% 則可透過注水次數來微調濃度。\n\n4:6 真的不是背公式，而是讓你開始理解：「我想要這杯咖啡變成什麼樣子？」', 'The 4:6 method is simple at heart: split the total brew water into a front 40% and a back 60%.\n\n· Front 40% (2 pours): controls the acidity–sweetness balance\n· Back 60% (3 pours): controls the strength\n\nIt turns flavour into an adjustable "math problem", so anyone can brew a stable, tasty cup at home.\n\nHow to split: the first pour is based on 3× the coffee weight (e.g. 20g coffee → 60g). Want more acidity? Pour more on the first; want it sweeter? Pour less — either way, the first two pours always add up to the same front 40%. Use the number of pours in the back 60% to fine-tune strength.\n\n4:6 isn\'t about memorising a formula — it\'s about asking: "What do I want this cup to become?"', '4:6メソッドの核心はシンプル：総湯量を「前40%」と「後60%」に分けます。\n\n· 前40%（2投）：酸味と甘みのバランスを決める\n· 後60%（3投）：濃度を決める\n\n風味を調整できる「数式」に変え、自宅でも安定して美味しい一杯を淹れやすくします。\n\n分け方：第1投は粉量の3倍が基準（例：粉20g→60g）。酸味を強くしたいなら第1投を多く、甘くしたいなら少なく——どちらでも前2投の合計は同じ「前40%」。後60%は注ぐ回数で濃度を微調整。\n\n4:6は公式を覚えることではなく、「この一杯をどうしたいか？」を考えること。'), steps: [rs('v1', '0:00', pAct, l('第一段 (前40%)', '1st pour (First 40%)', '第1投 (最初の40%)'), 60), rs('v2', '0:45', pAct, l('第二段 (前40%)', '2nd pour (First 40%)', '第2投 (最初の40%)'), 120), rs('v3', '1:30', pAct, l('第三段 (後60%)', '3rd pour (Last 60%)', '第3投 (残りの60%)'), 180), rs('v4', '2:15', pAct, l('第四段 (後60%)', '4th pour (Last 60%)', '第4投 (残りの60%)'), 240), rs('v5', '2:45', pAct, l('第五段 (後60%)', '5th pour (Last 60%)', '第5投 (残りの60%)'), 300), rs('v6', '3:30', dAct, l('待咖啡液流乾', 'Wait for drawdown', '落ちきるまで待つ'), null)] },

function WaterAquacode({ c, l, formatNum, tdssizeOptions }) {
  const [mode, setMode] = useState('single');
  const [tds, setTds] = useState('');const [targetTds, setTargetTds] = useState('');
  const [water, setWater] = useState('');const [waterReq, setWaterReq] = useState('');const [tdsComp, setTdsComp] = useState('');
  const classes = useClasses(c);

  const calcResult = (tdsVal, targetVal, waterVal) => {
    const tdsResult = parseFloat(targetVal) * parseFloat(waterVal) / parseFloat(tdsVal);
    return [tdsResult, parseFloat(waterVal) - tdsResult];
  };

  let singleResult = null;let singleError = null;
  if (tds && targetTds && water && parseFloat(tds) > 0 && parseFloat(targetTds) > 0 && parseFloat(water) > 0) {
    if (parseFloat(targetTds) > parseFloat(tds)) singleError = l('目標 TDS 不可大於濃縮液', 'Target cannot exceed Concentrate', '目標が濃縮液を超えています');else
    {
      const [r1, r2] = calcResult(tds, targetTds, water);
      singleResult = { tdsAmount: r1, waterAmount: r2 };
    }
  }

  let multiResults = [];
  if (waterReq && tdsComp && parseFloat(waterReq) > 0 && parseFloat(tdsComp) > 0) {
    for (let i = 100; i > 0; i -= 5) {
      if (i <= parseFloat(tdsComp)) {
        const [r1, r2] = calcResult(tdsComp, i, waterReq);
        multiResults.push({ target: i, tdsAmount: r1, waterAmount: r2 });
      }
    }
  }

  return (
    <div className={`${classes.card} p-5 sm:p-6 space-y-5 animate-in fade-in`}>

                <button onClick={() => setMode('single')} className={`flex-1 py-3 font-bold rounded-xl transition-colors outline-none ${mode === 'single' ? `${c.primary} text-white` : `${c.inputBg} ${c.textDark} border ${c.border}`}`}>{l('單個TDS', 'Single Target', '単一目標TDS')}</button>

            {mode === 'single' ?
      <div className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div><label className={classes.label}>{l('濃縮液 TDS', 'Concentrate TDS', '濃縮液 TDS')}</label><input type="number" value={tds} onChange={(e) => setTds(e.target.value)} placeholder="0" className={classes.input} /></div>
                        <div>
                            <label className={classes.label}>{l('快速代入 (容量)', 'Auto-fill (Vol)', '自動入力')}</label>
                            <div className="relative">
                                <select onChange={(e) => setTds(e.target.value)} value={tdssizeOptions.some((opt) => opt.value == tds) ? tds : ""} className={`${classes.select} ${tds === '' ? 'text-gray-400' : c.textDark}`}>
                                    <option value="" disabled>{l('選擇...', 'Select...', '選択...')}</option>{tdssizeOptions.map((opt) => <option key={opt.label} value={opt.value}>{opt.label}</option>)}
                                </select>

                            </div>

                    </div>
                    <div><label className={classes.label}>{l('目標 TDS', 'Target TDS', '目標 TDS')}</label><input type="number" value={targetTds} onChange={(e) => setTargetTds(e.target.value)} placeholder="0" className={classes.input} /></div>
                    <div><label className={classes.label}>{l('沖煮水量', 'Total Water', '抽出水量')}</label><input type="number" value={water} onChange={(e) => setWater(e.target.value)} placeholder="0" className={classes.input} /></div>
                    {singleError && <div className="mt-4 p-4 rounded-xl bg-red-500/10 text-red-600 text-sm font-bold text-center">{singleError}</div>}
                    {singleResult && !singleError &&
        <div className="sticky z-20 rounded-2xl p-5 text-white shadow-lg lg:static" style={{ background: '#2E6A4B', bottom: 'calc(70px + env(safe-area-inset-bottom))' }}>

                            <div className="h-2 rounded-full bg-white/20 mt-3 overflow-hidden"><div className="h-full bg-white/85 rounded-full" style={{ width: `${Math.max(2, Math.min(100, singleResult.tdsAmount / (singleResult.tdsAmount + singleResult.waterAmount) * 100))}%` }}></div></div>

                            <div className="relative">
                                <select onChange={(e) => setTdsComp(e.target.value)} value={tdssizeOptions.some((opt) => opt.value == tdsComp) ? tdsComp : ""} className={`${classes.select} ${tdsComp === '' ? 'text-gray-400' : c.textDark}`}>
                                    <option value="" disabled>{l('選擇...', 'Select...', '選択...')}</option>
                                    {tdssizeOptions.map((opt) => <option key={opt.label} value={opt.value}>{opt.label}</option>)}

                            </div>
                        </div>
                    </div>
                    <div><label className={classes.label}>{l('需求水量', 'Required Water', '必要な水量')}</label><input type="number" value={waterReq} onChange={(e) => setWaterReq(e.target.value)} placeholder="0" className={classes.input} /></div>

                <div className="flex flex-col gap-2 mt-4 pt-4 border-t border-[#C18F8F]/20">

                    <p className={`text-[11px] sm:text-xs font-bold ${c.yellowText}`}>[2] JAMM (Ca)：{l('放大醇厚度與甜感', 'Enhances richness & sweet', 'コクと甘みを増幅させる')}</p>

                    <div className="grid grid-cols-3 gap-3">

                        <div><label className={`block text-[10px] font-black ${c.yellowText} mb-1`}>JAMM</label><input type="number" min="0" value={apaxCustomDrops.j || ''} onChange={(e) => setApaxCustomDrops({ ...apaxCustomDrops, j: Number(e.target.value) })} placeholder="0" className={`w-full bg-white dark:bg-[#1C1F22] border ${c.border} ${c.textDark} font-bold py-2 px-2 rounded-lg text-center`} /></div>
                        <div><label className={`block text-[10px] font-black ${c.blueText} mb-1`}>LYLAC</label><input type="number" min="0" value={apaxCustomDrops.l || ''} onChange={(e) => setApaxCustomDrops({ ...apaxCustomDrops, l: Number(e.target.value) })} placeholder="0" className={`w-full bg-white dark:bg-[#1C1F22] border ${c.border} ${c.textDark} font-bold py-2 px-2 rounded-lg text-center`} /></div>

                    <p className={`text-center text-[11px] font-bold ${c.textMuted} mb-4 uppercase tracking-widest`}>{l('總水量所需添加量', 'Required Addition', '必要な追加量')}</p>
                    <div className="grid grid-cols-3 gap-2 sm:gap-4">
                        {apaxCards.map((item) =>
          <div key={item.key} className={`flex flex-col items-center justify-center p-3 sm:p-5 rounded-2xl ${c.inputBg} border ${c.border} shadow-sm relative overflow-hidden`}>
                                <div className={`absolute top-0 w-full h-1.5 ${item.color}`}></div>
                                <div className={`text-[10px] font-black ${item.text} mb-2`}>{item.name}</div>
                                <div className={`text-2xl sm:text-4xl font-black ${c.textDark} mb-1`}>{formatNum(item.drops * apaxRatio)}</div>
                                <div className={`text-[10px] sm:text-xs font-bold ${c.textMuted}`}>{l('滴', 'Drops', '滴')}</div>
                                <div className={`mt-2 text-[10px] sm:text-[11px] font-bold ${c.textMuted} bg-black/5 dark:bg-white/5 px-2 py-0.5 rounded`}>{calcApaxGrams(item.drops)} g</div>
                            </div>
          )}
                    </div>
                </div>
      }
        </>}
        </div>);

}

// ==========================================
// 6b. 模組：WaterApaxTune — 喝到後的風味微調（官方 post-brew 滴入用量）
// ==========================================
const APAX_BOTTLES = {
  t: { name: 'TONIK [1]', ck: 'red' },
  j: { name: 'JAMM [2]', ck: 'yellow' },
  y: { name: 'LYLAC [3]', ck: 'blue' },
  k: { name: 'KONFLUX [K]', ck: 'secondary' } };


function WaterApaxTune({ c, l, formatNum }) {
  const classes = useClasses(c);
  const [drink, setDrink] = useState('filter');
  const [vol, setVol] = useState('200');
  const [lv, setLv] = useState({ t: 0, j: 0, y: 0, k: 0 });

  const AXES = [
  { b: 't', label: l('酸亮度 · 多汁感', 'Brightness · juiciness', '明るさ・ジューシーさ'), sub: l('風味強度、清爽酸質', 'Flavour intensity, crisp acidity', '風味の強度、清澄な酸') },
  { b: 'j', label: l('甜感 · 厚度', 'Sweetness · body', '甘さ・ボディ'), sub: l('也用來壓住過強的酸或苦', 'Also tames overpowering acidity or bitterness', '強すぎる酸・苦味も抑える') },
  { b: 'y', label: l('花香 · 細緻度', 'Floral · delicacy', '華やかさ・繊細さ'), sub: l('延長餘韻、降低尾韻乾澀', 'Extends the finish, reduces dryness', '余韻を伸ばし乾きを軽減') },
  { b: 'k', label: l('口感層次 · 滑順度', 'Texture · smoothness', '口当たり・なめらかさ'), sub: l('包覆感與整體和諧感', 'Coating mouthfeel and overall harmony', '包み込む質感と調和') }];

  const WHY = {
    t: l('官方：咖啡偏重、缺乏明亮度與酸質，或想把既有酸質再突顯時使用。適合水洗、衣索比亞／肯亞、藝妓等花香品種。', 'Official: use when the coffee feels heavy, lacks brightness, or you want to highlight existing acidity. Suits washed, Ethiopian/Kenyan, Geisha-type coffees.', '公式：重く感じる・明るさが足りない、または既存の酸を際立たせたい時。ウォッシュド、エチオピア／ケニア、ゲイシャ系に。'),
    j: l('官方：甜感不足、口感太薄，或酸／苦過於強勢時使用。適合日曬、南美與東南亞、發酵處理豆。', 'Official: use when sweetness is lacking, the body is thin, or acidity/bitterness is overpowering. Suits naturals, South American and SE Asian, fermented coffees.', '公式：甘さ不足・ボディが薄い、酸や苦味が強すぎる時。ナチュラル、南米・東南アジア、発酵系に。'),
    y: l('官方：需要更圓潤、花香與柑橘調不夠明顯，或尾韻粗糙乾澀時使用。可延長餘韻、降低乾澀感。', 'Official: use when the cup needs roundness, florals/citrus are not intense enough, or the aftertaste is rough and dry. Extends the finish and reduces dryness.', '公式：丸みが欲しい、華やかさや柑橘感が弱い、後味が粗く乾く時。余韻を伸ばし乾きを軽減。'),
    k: l('官方：2025 世界手沖冠軍賽開發的配方，專為提升口感厚度、層次與整體和諧感，只需幾滴。獲 SCA 2026 最佳新產品。', 'Official: developed for the 2025 World Brewers Cup to add mouthfeel, depth and harmony — only a few drops needed. SCA Best New Product 2026.', '公式：2025年ワールドブリューワーズカップ向けに開発。口当たり・奥行き・調和を高め、数滴で十分。SCA 2026最優秀新製品。') };

  const OVER = {
    t: l('過量會出現過強的酸、乾澀感與明顯鹹味。', 'Too much brings overpowering acidity, dryness and a noticeable saltiness.', '入れすぎると酸が強すぎ、乾いた質感と塩味が出ます。'),
    j: l('過量會壓平酸度，並帶來粉筆般的乾澀與過重的 body。', 'Too much flattens acidity and brings chalky dryness with an overly heavy body.', '入れすぎると酸が平坦になり、チョーキーな乾きと重すぎるボディに。'),
    y: l('過量會帶出不舒服的苦味。', 'Too much brings an unpleasant bitterness.', '入れすぎると不快な苦味が出ます。'),
    k: l('官方僅強調「幾滴即可」，建議從最少量開始試。', 'Official guidance is simply "a few drops" — start with the smallest dose.', '公式は「数滴で十分」。最少量から試してください。') };

  const LVNAME = [l('不調整', 'Off', '調整なし'), l('微幅', 'Subtle', 'ごく僅か'), l('輕度', 'Light', '軽め'), l('中等', 'Medium', '中程度'), l('明顯', 'Strong', 'しっかり'), l('最大', 'Max', '最大')];

  const DROP_G = 0.0625;
  const v = parseFloat(vol) || 0;
  // 官方 post-brew 是「每杯總量」：手沖 200ml 為 3~12 滴（= 0.94~3.75 g/L，與官方調水 1~4 g/L 同一濃度帶）；
  // 濃縮為每份 1~3 滴。因此總滴數由最高強度決定，再按各軸強度比例分配，總和不會超過官方上限。
  const base = drink === 'espresso' ? { s: 1, m: 3, ref: 30 } : { s: 3, m: 12, ref: 200 };
  const ratio = v > 0 ? v / base.ref : 0;
  const gramsOf = (d) => formatNum(d * DROP_G);
  const active = AXES.filter((a) => lv[a.b] > 0);
  const maxLv = active.reduce((n, a) => Math.max(n, lv[a.b]), 0);
  const total = maxLv <= 0 ? 0 : Math.max(1, Math.round((base.s + (maxLv - 1) / 4 * (base.m - base.s)) * ratio));
  // 依強度權重分配總滴數（最大餘數法，確保各瓶相加 = 總量）
  const alloc = useMemo(() => {
    const out = {};
    if (!active.length || total <= 0) return out;
    // 總滴數就是官方上限，不能被「每軸至少 1 滴」推高：
    // 因此最多只讓 total 個軸分到滴數（依強度高低排序取前 total 名）。
    const sorted = [...active].sort((p, q) => lv[q.b] - lv[p.b]);
    const parts = sorted.slice(0, Math.min(sorted.length, total));
    const wSum = parts.reduce((n, a) => n + lv[a.b], 0) || 1;
    const raw = parts.map((a) => ({ b: a.b, x: total * lv[a.b] / wSum }));
    let used = 0;
    raw.forEach((r) => { out[r.b] = Math.floor(r.x); used += out[r.b]; });
    raw.map((r) => ({ b: r.b, f: r.x - Math.floor(r.x) })).sort((p, q) => q.f - p.f)
      .slice(0, Math.max(0, total - used)).forEach((r) => { out[r.b] += 1; });
    // 分到 0 滴的參與軸，從最多的軸「借」一滴（不新增，總和不變）
    parts.forEach((a) => {
      if (out[a.b] > 0) return;
      const donor = parts.reduce((best, x) => (out[x.b] || 0) > (out[best.b] || 0) ? x : best, parts[0]);
      if ((out[donor.b] || 0) > 1) { out[donor.b] -= 1; out[a.b] = 1; }
    });
    return out;
  }, [total, lv.t, lv.j, lv.y, lv.k]);
  const totalDrops = active.reduce((n, a) => n + (alloc[a.b] || 0), 0);
  const gPerL = v > 0 ? totalDrops * DROP_G / (v / 1000) : 0;
  const atMax = maxLv >= 5 && totalDrops > 0;
  const tooMany = active.length > total && total > 0;
  const volRange = drink === 'espresso' ? { lo: 15, hi: 100 } : { lo: 60, hi: 600 };
  const volBad = v > 0 && (v < volRange.lo || v > volRange.hi);

  return (
    <div className="space-y-5">
        <div className={`p-4 sm:p-5 rounded-xl ${c.inputBg} border ${c.border}`}>
            <p className={`text-[12px] sm:text-[13px] ${c.textMuted} leading-relaxed font-medium`}>{l('已經沖好、喝到了不滿意的地方？拉動下方風味強度，就會算出各瓶該滴幾滴。用量依 APAX LAB 官方 post-brew 建議：手沖每杯 3 滴起、最多 12 滴；濃縮 1 滴起、最多 3 滴，並依你的杯量換算。', 'Already brewed and something is off? Drag the intensity sliders and you get the drops per bottle. Amounts follow APAX LAB official post-brew guidance: filter from 3 drops up to 12; espresso from 1 up to 3 — scaled to your cup size.', '淹れた後に気になる点があれば、下の強度スライダーを動かせば各ボトルの滴数が出ます。APAX LAB公式のpost-brew推奨に基づき、ドリップは3滴から最大12滴、エスプレッソは1滴から最大3滴。カップ量に応じて換算します。')}</p>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label className={classes.label}>{l('咖啡類型', 'Coffee type', 'コーヒーの種類')}</label>
                <div className="flex gap-2">
                    <button onClick={() => {setDrink('filter');setVol('200');}} className={`flex-1 py-2.5 text-[12.5px] font-bold rounded-xl transition-colors outline-none ${drink === 'filter' ? `${c.primary} text-white` : `${c.inputBg} ${c.textMuted}`}`}>{l('手沖 / 濾泡', 'Filter', 'ドリップ')}</button>
                    <button onClick={() => {setDrink('espresso');setVol('30');}} className={`flex-1 py-2.5 text-[12.5px] font-bold rounded-xl transition-colors outline-none ${drink === 'espresso' ? `${c.primary} text-white` : `${c.inputBg} ${c.textMuted}`}`}>{l('義式濃縮', 'Espresso', 'エスプレッソ')}</button>
                </div>
            </div>
            <div><label className={classes.label}>{l('杯中液量 (ml)', 'Liquid in cup (ml)', 'カップ内の液量 (ml)')}</label><input type="number" min="0" value={vol} onChange={(e) => setVol(e.target.value)} className={classes.input} /></div>
        </div>

        <div className="space-y-3">
            <div className="flex items-center justify-between">
                <label className={`${classes.label} !mb-0`}>{l('風味強度調整', 'Flavour intensity', '風味の強度調整')}</label>
                {active.length > 0 && <button onClick={() => setLv({ t: 0, j: 0, y: 0, k: 0 })} className={`text-[11px] font-bold ${c.textMuted} underline hover:opacity-70`}>{l('全部歸零', 'Reset all', 'すべてリセット')}</button>}
            </div>
            {AXES.map((a) => {
        const b = APAX_BOTTLES[a.b];
        const level = lv[a.b];
        const d = alloc[a.b] || 0;
        return (
          <div key={a.b} className={`rounded-2xl ${c.inputBg} border ${c.border} overflow-hidden ${level > 0 ? '' : 'opacity-70'}`}>
                    <div className={`h-1 w-full ${level > 0 ? c[b.ck] : c.accent}`}></div>
                    <div className="p-4">
                        <div className="flex items-start justify-between gap-3 mb-1">
                            <div className="min-w-0">
                                <p className={`text-[13px] font-black ${c.textDark} leading-snug`}>{a.label}</p>
                                <p className={`text-[11px] ${c.textMuted} font-medium mt-0.5`}>{a.sub}</p>
                            </div>
                            <div className="text-right shrink-0">
                                <p className={`text-[10px] font-black ${c[b.ck + 'Text']} leading-none mb-1`}>{b.name}</p>
                                <p className={`text-2xl font-black ${level > 0 ? c.textDark : c.textMuted} leading-none`}>{d > 0 ? d : '—'}<span className="text-[11px] font-bold ml-1">{d > 0 ? l('滴', 'dr', '滴') : ''}</span></p>
                                <p className={`text-[10px] font-bold ${c.textMuted} mt-0.5`}>{level > 0 ? LVNAME[level] : LVNAME[0]}</p>
                            </div>
                        </div>
                        <input type="range" min="0" max="5" step="1" value={level} onChange={(e) => setLv((s) => ({ ...s, [a.b]: parseInt(e.target.value, 10) }))} className="w-full mt-3 accent-current" style={{ accentColor: level > 0 ? undefined : '#9a9a9a' }} />
                        <div className="flex justify-between mt-1">
                            {LVNAME.map((n, k) => <span key={k} className={`text-[9.5px] font-bold ${k === level ? c.textDark : c.textMuted} ${k === level ? '' : 'opacity-50'}`}>{n}</span>)}
                        </div>
                    </div>
                </div>);
      })}
        </div>

        {(volBad || tooMany || atMax) &&
      <div className="space-y-2">
            {volBad &&
        <div className={`flex items-start gap-3 p-4 rounded-2xl ${c.red} bg-opacity-15 border-2 border-[#C18F8F]`}>
                    <span className="text-lg leading-none shrink-0">⚠️</span>
                    <div className="min-w-0">
                        <p className={`text-[13px] font-black ${c.textDark} mb-1`}>{l('杯量超出合理範圍', 'Cup volume out of range', 'カップ量が範囲外')}</p>
                        <p className={`text-[11.5px] ${c.textDark} leading-relaxed font-medium opacity-90`}>{l('目前填 ' + formatNum(v) + ' ml。' + (drink === 'espresso' ? '濃縮通常為 15~100 ml' : '手沖單杯通常為 60~600 ml') + '，超出範圍時換算出的滴數已不在官方驗證過的區間內，請確認數值。', 'You entered ' + formatNum(v) + ' ml. ' + (drink === 'espresso' ? 'Espresso is normally 15-100 ml' : 'A filter cup is normally 60-600 ml') + '; outside that range the calculated drops fall beyond what the official guidance covers. Please check the value.', '入力値は' + formatNum(v) + ' ml。' + (drink === 'espresso' ? 'エスプレッソは通常15〜100 ml' : 'ドリップ1杯は通常60〜600 ml') + 'です。範囲外では換算した滴数が公式の検証範囲を外れます。数値をご確認ください。')}</p>
                    </div>
                </div>
        }
            {tooMany &&
        <div className={`flex items-start gap-3 p-4 rounded-2xl ${c.yellow} bg-opacity-20 border-2 border-[#C9B793]`}>
                    <span className="text-lg leading-none shrink-0">⚠️</span>
                    <div className="min-w-0">
                        <p className={`text-[13px] font-black ${c.textDark} mb-1`}>{l('選的風味多於可分配的滴數', 'More attributes than drops available', '風味の数が滴数を超えています')}</p>
                        <p className={`text-[11.5px] ${c.textDark} leading-relaxed font-medium opacity-90`}>{l('官方單杯上限只有 ' + total + ' 滴，因此只分配給強度最高的 ' + total + ' 項，其餘顯示「—」。請提高強度、加大杯量，或減少同時調整的項目。', 'The official per-cup maximum is only ' + total + ' drops, so only the ' + total + ' strongest attributes get a dose; the rest show "—". Raise the intensity, use a larger cup, or adjust fewer attributes at once.', '公式のカップあたり上限は' + total + '滴のみのため、強度が高い上位' + total + '項目にのみ配分され、残りは「—」表示です。強度を上げる、量を増やす、または項目を減らしてください。')}</p>
                    </div>
                </div>
        }
            {atMax &&
        <div className={`flex items-start gap-3 p-4 rounded-2xl ${c.red} bg-opacity-15 border-2 border-[#C18F8F]`}>
                    <span className="text-lg leading-none shrink-0">🛑</span>
                    <div className="min-w-0">
                        <p className={`text-[13px] font-black ${c.textDark} mb-1`}>{l('已達官方建議上限，請勿再加', 'At the official maximum — do not add more', '公式上限に到達しています')}</p>
                        <p className={`text-[11.5px] ${c.textDark} leading-relaxed font-medium opacity-90`}>{l('目前 ' + totalDrops + ' 滴' + (drink === 'espresso' ? '' : '（' + formatNum(gPerL) + ' g/L）') + '已是官方' + (drink === 'espresso' ? '每份 3 滴' : '每杯 12 滴') + '的上限。再往上加容易出現過酸、乾澀、粉筆感或不悅的苦味，且無法回頭。建議先攪拌試喝，真的不夠再重新沖一杯調整參數。', 'At ' + totalDrops + ' drops' + (drink === 'espresso' ? '' : ' (' + formatNum(gPerL) + ' g/L)') + ' you are at the official maximum of ' + (drink === 'espresso' ? '3 drops per shot' : '12 drops per cup') + '. Going further risks harsh acidity, dryness, chalkiness or unpleasant bitterness — and it cannot be undone. Stir and taste first; if it is still not enough, rebrew with adjusted parameters instead.', '現在' + totalDrops + '滴' + (drink === 'espresso' ? '' : '（' + formatNum(gPerL) + ' g/L）') + 'で、公式上限（' + (drink === 'espresso' ? '1ショット3滴' : '1杯12滴') + '）に達しています。これ以上は過度な酸味・乾き・チョーキーさ・不快な苦味の原因となり、後戻りできません。まず撹拌して試飲し、それでも足りない場合はパラメータを変えて淹れ直してください。')}</p>
                    </div>

        {active.length === 0 ?
      <div className={`p-6 rounded-2xl ${c.inputBg} border border-dashed ${c.border} text-center`}>

            </div> :

      <div className={`rounded-2xl ${c.inputBg} border ${c.border} overflow-hidden`}>

                    <div className="flex items-center justify-between mb-4">

                    </div>
                    <div className="space-y-2">
                        {active.filter((a) => (alloc[a.b] || 0) > 0).map((a) => {
              const b = APAX_BOTTLES[a.b];
              const d = alloc[a.b] || 0;
              return (
                <div key={a.b} className={`flex items-center gap-3 p-3 rounded-xl ${c.card} border ${c.border}`}>
                                <div className={`w-1.5 h-9 rounded-full ${c[b.ck]} shrink-0`}></div>
                                <div className="min-w-0 flex-1">
                                    <p className={`text-[12.5px] font-black ${c[b.ck + 'Text']}`}>{b.name}</p>
                                    <p className={`text-[10.5px] ${c.textMuted} font-bold`}>{LVNAME[lv[a.b]]}</p>
                                </div>
                                <p className={`text-xl font-black ${c.textDark} shrink-0`}>{d}<span className={`text-[10px] font-bold ${c.textMuted} ml-1`}>{l('滴', 'dr', '滴')} · {gramsOf(d)} g</span></p>
                            </div>);
            })}
                    </div>
                    {drink === 'espresso' ?
          <p className={`mt-3 text-[11px] ${c.textMuted} font-medium leading-relaxed`}>{l('濃縮的官方建議是以「每份滴數」計（1 滴起、最多 3 滴），濃度本身高於手沖用的 1~4 g/L 帶屬正常，不做濃度帶比較。1 滴 = 0.0625 g。多個風味同時調整時，總量依強度比例分配，不會超過每份上限。', 'For espresso the official guidance is a per-shot drop count (from 1 up to 3 drops); its concentration is intentionally higher than the 1-4 g/L filter band, so no band comparison is made. 1 drop = 0.0625 g. Adjusting several attributes splits the total by intensity rather than stacking it.', 'エスプレッソの公式推奨は「1ショットあたりの滴数」（1滴から最大3滴）。濃度はドリップ用の1〜4 g/L帯より高くなるのが正常なため、帯との比較は行いません。1滴=0.0625g。複数の風味を同時に調整しても合計は加算されず強度比で配分されます。')}</p> :
          <p className={`mt-3 text-[11px] ${c.textMuted} font-medium leading-relaxed`}>{gPerL >= 1 && gPerL <= 4 ?
            l('這個總量相當於每公升 ' + formatNum(gPerL) + ' 克，落在官方建議的 1~4 g/L 濃度帶內（1 滴 = 0.0625 g）。多個風味同時調整時，總量不會疊加超標，而是依強度比例分配。', 'This total works out to ' + formatNum(gPerL) + ' g per litre, inside the official 1-4 g/L band (1 drop = 0.0625 g). When you adjust several attributes at once the total is split by intensity rather than stacked.', 'この合計は1リットルあたり' + formatNum(gPerL) + 'グラム相当で、公式の1〜4 g/L帯に収まります（1滴=0.0625g）。複数の風味を同時に調整しても合計は加算されず、強度比で配分されます。') :
            l('這個總量相當於每公升 ' + formatNum(gPerL) + ' 克，略低於官方常用的 1~4 g/L 濃度帶，屬於最輕微的微調（1 滴 = 0.0625 g）。若感覺不出差異，可把強度往右再拉一級。', 'This total works out to ' + formatNum(gPerL) + ' g per litre, just under the usual official 1-4 g/L band — the lightest possible nudge (1 drop = 0.0625 g). If you cannot taste a difference, move the slider one step further right.', 'この合計は1リットルあたり' + formatNum(gPerL) + 'グラム相当で、公式の1〜4 g/L帯をわずかに下回る最も軽い微調整です（1滴=0.0625g）。違いが分からない場合は強度を1段上げてください。')}</p>
          }
                    <div className={`mt-4 pt-4 border-t border-dashed ${c.border} space-y-3`}>
                        {active.filter((a) => (alloc[a.b] || 0) > 0).map((a) =>
            <div key={a.b}>
                                <p className={`text-[11.5px] ${c.textMuted} leading-relaxed font-medium`}><span className={`font-black ${c[APAX_BOTTLES[a.b].ck + 'Text']}`}>{APAX_BOTTLES[a.b].name}</span> {WHY[a.b]}</p>
                                <p className={`text-[11px] ${c.redText} leading-relaxed font-bold mt-1`}>⚠︎ {OVER[a.b]}</p>
                            </div>
            )}
                    </div>
                    <p className={`mt-4 pt-4 border-t border-dashed ${c.border} text-[11.5px] ${c.textMuted} leading-relaxed font-medium`}>{l('官方提醒：一次少量慢慢加，每次加完充分搖晃或攪拌讓礦物完全溶解，邊試邊調。礦物液本身不含香料，只是改變味覺對咖啡既有風味的感受。商用義式機請勿直接加入水箱（家用最多 1g/L），濃縮建議萃取後再滴。', 'Official reminders: add gradually, swirl or stir thoroughly so the minerals dissolve fully, and taste as you go. The concentrates contain no flavourings — they change how you perceive what is already in the cup. Do not dose commercial espresso machines directly (home machines 1g/L max); for espresso, dose after extraction.', '公式の注意：少量ずつ加え、しっかり撹拌して溶かし、味を見ながら調整。濃縮液に香料は含まれず、既にある風味の感じ方を変えるだけです。業務用エスプレッソマシンへの直接投入は不可（家庭用は最大1g/L）。エスプレッソは抽出後に滴下を推奨。')}</p>
                </div>
            </div>
      }
    </div>);

}

// 8. Troubleshooter (風味羅盤組件)
// ==========================================
function Troubleshooter({ recipe, c, t, lang, onClose }) {
  const l = (zh, en, ja) => ({ zh, en, ja })[lang] || zh;
  const [scores, setScores] = useState({ a: 3, s: 3, b: 3, bd: 3, af: 3 });

  const dimLabels = {
    a: { icon: <Citrus size={16} />, label: t('dim_acid'), color: 'text-[#C18F8F]', hex: '#C18F8F' },
    s: { icon: <Honey size={16} />, label: t('dim_sweet'), color: 'text-[#C9B793]', hex: '#C9B793' },
    b: { icon: <Astringent size={16} />, label: t('dim_bitter'), color: 'text-[#B3A394]', hex: '#B3A394' },
    bd: { icon: <Mouthfeel size={16} />, label: t('dim_body'), color: 'text-[#7A93A2]', hex: '#7A93A2' },
    af: { icon: <Wind size={16} />, label: t('dim_after'), color: 'text-[#7E8D85]', hex: '#7E8D85' }
  };

  const polygonPoints = useMemo(() => {
    const keys = ['a', 's', 'b', 'bd', 'af'];
    return keys.map((key, i) => {
      const score = scores[key];
      const r = score / 5 * 40;
      const angle = Math.PI * 2 * i / 5 - Math.PI / 2;
      return `${50 + r * Math.cos(angle)},${50 + r * Math.sin(angle)}`;
    }).join(' ');
  }, [scores]);

  const getDiagnosis = () => {
    const { a, s, b, bd, af } = scores;
    if (a === 3 && s === 3 && b === 3 && bd === 3 && af === 3) {
      return { title: l("雷達處於預設狀態 (Default State)", "Default Radar", "デフォルト状態"), desc: l("請拉動數值描繪風味。系統將綜合咖啡萃取科學與參數變因，為您解析可溶性芳香物質的釋放階段，並提供大方向的專業微調建議。", "Adjust sliders to map your flavor. The system applies Extraction Theory to analyze soluble compound release and offer professional parameter corrections.", "数値をスライドして風味を描いてください。抽出理論に基づき、可溶性成分の放出を分析し、専門的なパラメータ補正を大枠で提案します。") };
    }
    if (s >= 4 && af >= 4 && b <= 2) {
      return { title: l("理想萃取 / 貼近甜蜜點 (Ideal Extraction)", "Ideal Extraction", "理想的な抽出"), desc: l("【科學成因】\n甜感飽滿且餘韻綿長，表示萃取率 (EY) 完美落在 18%-22% 的理想區間。優質芳香物質與梅納反應產生的中大分子糖分已充分釋放，且成功避開了沖煮尾段的重度苦味物質。\n\n【調整建議】\n這是一次極高水準的沖煮！請鎖定目前的「水粉比、水溫、研磨度」鐵三角，依此為基準點微調即可。", "[Science]\nEY hitting the 18-22% sweet spot. Maillard reaction sugars are fully dissolved, avoiding late-stage bitter compounds.\n\n[Action]\nOutstanding brew! Lock in your current brew ratio, temperature, and grind size as your golden baseline.", "豊かな甘みと長い余韻は、収率(EY)が18-22%の理想的な範囲にあることを示します。非常に素晴らしい抽出です！現在の粉量、湯温、挽き目をベースラインとして固定してください。") };
    }
    if (a >= 4 && b >= 4) {
      return { title: l("極端不均萃取 / 通道效應 (Uneven Extraction)", "Channeling", "不均一な抽出 / チャネリング"), desc: l("【科學成因】\n同時出現尖銳有機酸與木質部苦澀，是典型的「通道效應」。水流避開了大部分粉層，導致局部粉層被過度萃取，而其餘粉層萃取不足。\n\n【調整建議】\n1. 改善佈水均勻度，注水時避免水流過大或直接衝擊濾紙邊緣。\n2. 檢查磨豆機均勻度，若細粉過多易導致底部阻塞而引發側邊通道。", "[Science]\nSimultaneous sharp acids and harsh bitterness indicate channeling. Water bypasses the bed, locally over-extracting while under-extracting the rest.\n\n[Action]\n1. Improve pouring technique; avoid hitting filter edges.\n2. Check grinder consistency; excess fines can force side channels.", "鋭い酸味と渋みが同時に現れるのは典型的なチャネリングです。注湯の均一性を改善し、ミルの均一性を確認してください。") };
    }
    if (b >= 4) {
      return { title: l("萃取過度 / 乾餾物質釋出 (Over-Extraction)", "Over-Extraction", "過抽出 (オーバーエクストラクション)"), desc: l("【科學成因】\n咖啡風味溶出順序為：酸 ➔ 甜 ➔ 苦。當苦澀感佔據主導，意味著萃取進入尾段，將大分子的多酚類與乾餾物質強制溶出。這通常肇因於：水溫過高，或擾動過度。\n\n【調整建議】\n1. 研磨度調粗 1-2 格。2. 沖煮水溫降低 2-3°C。3. 減少斷水次數，採用中心平穩注入。", "[Science]\nExtraction order: Acids ➔ Sugars ➔ Bitters. Dominant harshness means late-stage high-molecular compounds were forced out.\n\n[Action]\n1. Grind 1-2 clicks coarser. 2. Lower temp by 2-3°C. 3. Reduce pouring stages.", "渋みが強い場合、終盤の成分が溶け出しています。挽き目を粗くし、湯温を2-3℃下げ、注湯回数を減らしてください。") };
    }
    if (a >= 4 && s <= 2) {
      return { title: l("萃取不足 / 有機酸失衡 (Under-Extraction)", "Under-Extraction", "未抽出 (アンダーエクストラクション)"), desc: l("【科學成因】\n水果酸最先被溶出。若在此階段後萃取動能不足帶出糖分來提供「包覆感」，就會呈現單薄且刺鼻的尖酸。主因通常是：粉粒過粗或水溫偏低。\n\n【調整建議】\n1. 研磨度調細 1-2 格。2. 提高水溫 2°C。3. 延長悶蒸時間 10 秒，確保粉層完全濕潤。", "[Science]\nLow-weight acids extract first. Without mid-stage sugars to envelop them, the acidity tastes sharp. Causes: grind too coarse or water too cool.\n\n[Action]\n1. Grind 1-2 clicks finer. 2. Raise temp by 2°C. 3. Extend bloom time.", "糖分が不足すると、鋭い酸味になります。原因は粗すぎる挽き目や低い湯温です。挽き目を細かくし、湯温を上げ、蒸らし時間を長くしてください。") };
    }
    if (bd <= 2 && b <= 3) {
      return { title: l("濃度偏低 / 總溶解固體量不足 (Low TDS)", "Low TDS (Watery)", "濃度不足 (Low TDS)"), desc: l("【科學成因】\n觸感單薄、缺乏醇厚度（Body），反映出總溶解固體量不足。可能是水粉比太大，或水流過快產生 Bypass。\n\n【調整建議】\n1. 增加 1-2g 粉量，維持總水量不變。2. 放慢注水流速以增加接觸時間。", "[Science]\nThin mouthfeel indicates low TDS. Due to wide ratio or water bypass.\n\n[Action]\n1. Increase dose by 1-2g. 2. Pour slower to increase contact time.", "口当たりが薄いのはTDS不足です。水量を変えずに粉量を増やすか、注ぐ速度を遅くしてください。") };
    }
    return { title: l("結構完整，具微調潛力 (Balanced Profile)", "Balanced Profile", "バランスの取れた風味"), desc: l("【科學成因】\n數據平衡，表示萃取率在合理範圍內。接下來的目標是尋找這支豆子的「甜蜜點」。\n\n【調整建議】\n若想提升香氣可提高水溫 1°C；若想增加醇厚度與甜感，可在注水時放低壺嘴，減緩水流衝擊以增加浸泡感。", "Extraction is within a reasonable range. Tweak temp or agitate more gently to hit the perfect sweet spot.", "妥当な範囲にあります。さらに複雑さを引き出すには、湯温や注ぐリズムを微調整してください。") };
  };

  const diagnosis = getDiagnosis();

  return (
    <div className={`mt-6 p-5 sm:p-6 rounded-3xl border ${c.border} ${c.card} shadow-sm animate-in slide-in-from-top-2 duration-300`}>
    <div className="flex items-center justify-between mb-2">
        <h4 className={`text-sm font-black ${c.textDark} flex items-center gap-2`}><Compass size={18} className={c.primaryText} /> {t('tweak_title')}</h4>
        <div className="flex gap-2">
            <button onClick={() => setScores({ a: 3, s: 3, b: 3, bd: 3, af: 3 })} className={`text-[10px] font-bold ${c.textMuted} px-2 py-1 rounded-md ${c.inputBg} hover:opacity-80 transition-opacity outline-none`}>{t('tweak_reset')}</button>
            <button onClick={onClose} className={`text-[10px] font-bold ${c.textMuted} px-2 py-1 rounded-md ${c.inputBg} hover:opacity-80 transition-opacity outline-none`}>✕</button>
        </div>
    </div>
    <p className={`text-[11px] sm:text-xs ${c.textMuted} mb-6 font-bold leading-relaxed`}>{t('tweak_desc')}</p>

    <div className="flex flex-col md:flex-row items-center gap-6 md:gap-8">
        <div className={`w-32 h-32 sm:w-40 sm:h-40 shrink-0 relative flex items-center justify-center rounded-full ${c.inputBg} border ${c.border} shadow-inner`}>
            <svg viewBox="0 0 100 100" className="absolute inset-0 m-auto w-[80%] h-[80%] opacity-20">
                {[10, 20, 30, 40].map((r, idx) =>
            <polygon key={idx} fill="none" stroke="currentColor" strokeWidth="0.5" className={c.textMuted} points={[0, 1, 2, 3, 4].map((i) => `${50 + r * Math.cos(Math.PI * 2 * i / 5 - Math.PI / 2)},${50 + r * Math.sin(Math.PI * 2 * i / 5 - Math.PI / 2)}`).join(' ')} />
            )}
                {[0, 1, 2, 3, 4].map((i) =>
            <line key={i} x1="50" y1="50" x2={50 + 40 * Math.cos(Math.PI * 2 * i / 5 - Math.PI / 2)} y2={50 + 40 * Math.sin(Math.PI * 2 * i / 5 - Math.PI / 2)} stroke="currentColor" strokeWidth="0.5" className={c.textMuted} />
            )}
                {[0, 1, 2, 3, 4].map((i) => {
              const keys = ['a', 's', 'b', 'bd', 'af'];
              const angle = Math.PI * 2 * i / 5 - Math.PI / 2;
              const lr = 52;
              const x = 50 + lr * Math.cos(angle);
              const y = 50 + lr * Math.sin(angle);
              const shortLabels = { a: l('酸','Acid','酸'), s: l('甜','Sweet','甜'), b: l('苦','Bitter','苦'), bd: l('醇','Body','コク'), af: l('韻','Finish','余韻') };
              return <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="central" fontSize="7" fontWeight="800" fill={dimLabels[keys[i]].hex} opacity="0.85">{shortLabels[keys[i]]}</text>;
            })}
            </svg>
            <svg viewBox="0 0 100 100" className="absolute inset-0 m-auto w-[80%] h-[80%] overflow-visible">
                <polygon points={polygonPoints} fill={dimLabels[Object.keys(scores).reduce((best, k) => scores[k] > scores[best] ? k : best)].hex} fillOpacity="0.2" stroke={dimLabels[Object.keys(scores).reduce((best, k) => scores[k] > scores[best] ? k : best)].hex} strokeWidth="2" strokeLinejoin="round" />
                {[0, 1, 2, 3, 4].map((i) => {
              const keys = ['a', 's', 'b', 'bd', 'af'];
              const r = scores[keys[i]] / 5 * 40;
              return <circle key={i} cx={50 + r * Math.cos(Math.PI * 2 * i / 5 - Math.PI / 2)} cy={50 + r * Math.sin(Math.PI * 2 * i / 5 - Math.PI / 2)} r="3" fill="white" stroke={dimLabels[keys[i]].hex} strokeWidth="1.5" />;
            })}
            </svg>
        </div>

// 10. RecipeGrindSuggestion (配方內建研磨轉換與顯微鏡)
// ==========================================
function RecipeGrindSuggestion({ recipe, GRINDER_DATABASE, t, c, lang, defaultGrinder }) {
  const classes = useClasses(c);
  const [isGrindOpen, setIsGrindOpen] = useState(false);
  const [userGrinder, setUserGrinder] = useState(defaultGrinder && defaultGrinder !== (recipe.baseGrind && recipe.baseGrind.grinder) && GRINDER_DATABASE[defaultGrinder] ? defaultGrinder : '');

  const grindGroups = useMemo(() => {
    let grps = {};
    Object.entries(GRINDER_DATABASE).forEach(([key, g]) => {
      if (!grps[g.group]) grps[g.group] = [];
      grps[g.group].push({ key, name: g.name });
    });
    Object.keys(grps).forEach((k) => {
      grps[k].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
    });
    return grps;
  }, [GRINDER_DATABASE]);

  const convertedGrind = useMemo(() => {
    if (!userGrinder || !recipe.baseGrind) return null;
    const gA = GRINDER_DATABASE[recipe.baseGrind.grinder];const gB = GRINDER_DATABASE[userGrinder];const parsedA = parseFloat(recipe.baseGrind.val);
    if (!gA || !gB || isNaN(parsedA)) return null;
    let catIdx = -1;let r_ratio = 0;
    for (let i = 0; i < gA.ranges.length; i++) {let r = gA.ranges[i];if (r.min !== null && r.max !== null && parsedA >= r.min && parsedA <= r.max) {catIdx = i;r_ratio = (parsedA - r.min) / (r.max - r.min);break;}}
    if (catIdx === -1) return { error: t('err_match') };
    const rB = gB.ranges[catIdx];if (rB.min === null || rB.max === null) return { error: t('err_notsupport') };
    let valB = rB.min + r_ratio * (rB.max - rB.min);
    if (gB.step === 1) valB = Math.round(valB);else {let inv = 1.0 / gB.step;valB = Math.round(valB * inv) / inv;valB = parseFloat(valB.toFixed(2));}
    return { valB, unit: gB.unit };
  }, [userGrinder, recipe, GRINDER_DATABASE, t]);

  const baseCatIdx = useMemo(() => {
    if (!recipe.baseGrind) return -1;
    const targetGrinder = userGrinder && !convertedGrind?.error ? userGrinder : recipe.baseGrind.grinder;
    const targetVal = userGrinder && !convertedGrind?.error ? convertedGrind.valB : parseFloat(recipe.baseGrind.val);
    const gA = GRINDER_DATABASE[targetGrinder];
    if (!gA || isNaN(targetVal)) return -1;
    for (let i = 0; i < gA.ranges.length; i++) {
      let r = gA.ranges[i];
      if (r.min !== null && r.max !== null && targetVal >= r.min && targetVal <= r.max) return i;
    }
    return -1;
  }, [recipe.baseGrind, userGrinder, convertedGrind, GRINDER_DATABASE]);

  return (
    <div className={`${classes.card} overflow-hidden`}>
            <button onClick={() => setIsGrindOpen(!isGrindOpen)} className={`w-full flex items-center justify-between p-4 hover:bg-black/5 dark:hover:bg-white/5 transition-colors outline-none`}>
                <div className="flex items-center gap-3"><div className={`p-1.5 rounded-full ${c.infoBg} ${c.primaryText}`}><Settings2 size={16} /></div><span className={`text-sm font-bold ${c.textDark}`}>{t('suggest_grind_title')}</span></div>
                <div className="flex items-center gap-2">
                    {!isGrindOpen &&
          <span className={`text-[11px] font-bold ${c.textMuted} bg-black/5 dark:bg-white/5 px-2 py-1 rounded-md max-w-[150px] truncate border ${c.border}`}>
                            {GRINDER_DATABASE[recipe.baseGrind.grinder].name}: <span className={c.primaryText}>{recipe.baseGrind.val}</span>
                        </span>
          }
                    <ChevronDown size={18} className={`${c.textMuted} transition-transform ${isGrindOpen ? 'rotate-180' : ''}`} />
                </div>
            </button>
            {isGrindOpen &&
      <div className={`p-5 border-t ${c.border} ${c.bg}`}>
                    <div className="flex items-end justify-between mb-4">
                        <div><div className={`text-[10px] font-bold ${c.textMuted} uppercase tracking-wider mb-1`}>{t('base_grind')}</div><div className={`text-base font-black ${c.textDark}`}>{GRINDER_DATABASE[recipe.baseGrind.grinder].name}</div></div>
                        <div className={`text-2xl font-black ${c.primaryText}`}>{recipe.baseGrind.val}</div>
                    </div>
                    <div className={`h-px w-full ${c.border} mb-4`}></div>
                    <div className={`text-[10px] font-bold ${c.textMuted} uppercase tracking-wider mb-2`}>{t('my_grinder')}</div>
                    <div className="relative">
                        <select value={userGrinder} onChange={(e) => setUserGrinder(e.target.value)} className={`${classes.select} ${userGrinder === '' ? 'text-gray-400' : c.textDark} mb-4`}>
                            <option value="" disabled>{t('select_grinder_placeholder')}</option>
                            {Object.entries(grindGroups).map(([gName, items]) => <optgroup key={gName} label={gName} className={`${c.textMuted} font-bold`}>{items.map((item) => <option key={item.key} value={item.key} className={`${c.textDark} font-medium`}>{item.name}</option>)}</optgroup>)}
                        </select>
                        <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400 mb-4"><ChevronDown size={20} /></div>
                    </div>
                    {userGrinder &&
        <div className={`p-4 rounded-xl border ${c.border} ${c.card} flex items-center justify-between shadow-sm`}><span className={`text-sm font-bold ${c.textDark}`}>{t('converted_result')}</span>{convertedGrind?.error ? <span className="text-red-500 font-bold text-sm">{convertedGrind.error}</span> : <div className="text-right"><span className={`text-2xl font-black ${c.secondaryText}`}>{convertedGrind?.valB}</span><span className={`text-xs font-bold ${c.textMuted} ml-1`}>{convertedGrind?.unit}</span></div>}</div>
        }
                    
                    {baseCatIdx !== -1 &&
        <div className={`mt-6 pt-6 border-t ${c.border}`}>
                            <div className="px-2">
                                <div className={`text-xs font-bold ${c.textMuted} mb-3 flex items-center gap-2`}>
                                    <Settings2 size={16} /> 
                                    {userGrinder && !convertedGrind?.error ? GRINDER_DATABASE[userGrinder].name : GRINDER_DATABASE[recipe.baseGrind.grinder].name} {t('grind_visual')}
                                </div>
                                <div className={`flex h-4 rounded-full overflow-hidden ${c.bg} shadow-inner border ${c.border}`}>
                                    {t('grind_cats').map((cat, idx) =>
              <div key={idx} className={`w-1/5 border-r border-black/5 dark:border-white/10 transition-colors duration-300 ${baseCatIdx === idx ? c.bar[idx] : 'bg-transparent'}`}></div>
              )}
                                </div>
                                <div className={`flex text-[10px] sm:text-xs ${c.textMuted} mt-3 font-bold`}>
                                    {t('grind_cats').map((cat, idx) => {
                const displayGrinder = userGrinder && !convertedGrind?.error ? GRINDER_DATABASE[userGrinder] : GRINDER_DATABASE[recipe.baseGrind.grinder];
                const range = displayGrinder.ranges[idx];
                const rangeText = range && range.min !== null ? `${range.min} - ${range.max}` : '-';
                return (
                  <div key={idx} className={`w-1/5 flex flex-col items-center gap-1.5 whitespace-pre-wrap ${baseCatIdx === idx ? c.textDark : ''}`}>
                                                <span className="text-center leading-tight">{cat}</span>
                                                <span className={`px-1.5 py-0.5 rounded-md font-mono transition-all duration-300 ${baseCatIdx === idx ? `${c.bar[idx]} text-white shadow-md scale-110` : `${c.inputBg} border ${c.border}`}`}>{rangeText}</span>
                                            </div>);

              })}
                                </div>
                            </div>
                            <GrindVisualizer catIdx={baseCatIdx} c={c} lang={lang} />
                        </div>
        }
                </div>
      }
        </div>);

}

function useMedia(q) {
  const get = () => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
  const [m, setM] = useState(get);
  useEffect(() => {
    let mq; try { mq = window.matchMedia(q); } catch (e) { return undefined; }
    const h = () => setM(mq.matches);
    mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', h) : mq.removeListener(h); };
  }, [q]);
  return m;
}

// 濾杯資訊：id → 名稱、分類（錐形 cone／平底 flat／其他 other）
const CAT_KEYS = ['cone', 'flat', 'other'];
const latinFirst = (lang) => (a, b) => {
  const isLatin = (s) => /^[A-Za-z0-9]/.test(s);
  const la = isLatin(a.name), lb = isLatin(b.name);
  if (la !== lb) return la ? -1 : 1;

};

      items.forEach((d) => { byId[d.id] = d; });

}

const parseSec = (s) => { const m = String(s || '').match(/(\d+):(\d+)/); return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : -1; };
const parseRangeEnd = (s) => { const m = String(s || '').match(/\d+:\d+\s*[-–~～]\s*(\d+):(\d+)/); return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null; };

const relTime = (ts, t) => {
  if (!ts) return '';
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const days = Math.floor((d0.getTime() - ts) / 86400000) + 1;
  if (ts >= d0.getTime()) return t('rel_today');
  if (days <= 1) return t('rel_yesterday');
  if (days < 7) return fmt(t('rel_days'), { n: days });

  return t('rel_older');
};

// 研磨度換算（與研磨工具同一套邏輯）
function convertGrind(GDB, fromKey, val, toKey) {
  const gA = GDB[fromKey], gB = GDB[toKey]; const v = parseFloat(val);
  if (!gA || !gB || isNaN(v)) return null;
  let catIdx = -1, r = 0;
  for (let i = 0; i < gA.ranges.length; i++) { const x = gA.ranges[i]; if (x.min !== null && x.max !== null && v >= x.min && v <= x.max) { catIdx = i; r = x.max === x.min ? 0 : (v - x.min) / (x.max - x.min); break; } }
  if (catIdx === -1) return null;
  const rB = gB.ranges[catIdx]; if (rB.min === null || rB.max === null) return null;
  let out = rB.min + r * (rB.max - rB.min);
  if (gB.step === 1) out = Math.round(out); else { const inv = 1 / gB.step; out = parseFloat((Math.round(out * inv) / inv).toFixed(2)); }
  return { val: out, unit: gB.unit, name: gB.name };
}

// 依步驟時間計算每一步開始秒數（文字時間＝上一步 + 30 秒，與舊版相同）
function useStepTimes(recipe) {
  return useMemo(() => {
    const times = recipe.steps.map((s) => parseSec(s.time));
    if (times[0] === -1) times[0] = 0;
    for (let i = 1; i < times.length; i++) { if (times[i] === -1) times[i] = times[i - 1] + 30; }
    return times;
  }, [recipe]);
}

// 注水節奏：每一步的目標累計水量、注水時段
function usePourPlan(recipe, ratio, starts) {
  return useMemo(() => {
    const n = recipe.steps.length; let prev = 0;
    return recipe.steps.map((s, i) => {
      const start = Math.max(0, starts[i]);
      const nextStart = i < n - 1 ? starts[i + 1] : start + 30;
      const target = s.water != null ? s.water * ratio : prev;
      const rEnd = parseRangeEnd(s.time);
      const end = s.water != null ? (rEnd != null ? rEnd : Math.min(start + 15, Math.max(start + 1, nextStart))) : start;
      const row = { start, end: Math.max(end, start), from: prev, target, pour: s.water != null };
      prev = target;
      return row;
    });
  }, [recipe, ratio, starts]);
}
const expectedWater = (plan, idx, elapsed) => {
  if (idx < 0 || !plan[idx]) return 0;
  const p = plan[idx];
  if (!p.pour) return p.target;
  const span = p.end - p.start;
  const f = span <= 0 ? 1 : Math.min(1, Math.max(0, (elapsed - p.start) / span));
  return p.from + (p.target - p.from) * f;
};

// 注水曲線
function PourCurve({ plan, total, endSec, elapsed, dark }) {
  const W = 300, H = 150, L = 30, R = 8, T = 10, B = 22;
  const maxT = Math.max(endSec, ...plan.map((p) => p.end), 30);
  const x = (s) => L + (Math.max(0, s) / maxT) * (W - L - R);
  const y = (w) => T + (1 - (total ? w / total : 0)) * (H - T - B);
  const pts = [[0, 0]];
  plan.forEach((p) => { if (p.pour) { pts.push([p.start, p.from]); pts.push([p.end, p.target]); } });
  pts.push([maxT, plan.length ? plan[plan.length - 1].target : 0]);
  const line = pts.map(([s, w], i) => `${i ? 'L' : 'M'}${x(s).toFixed(1)},${y(w).toFixed(1)}`).join(' ');
  const area = `${line} L${x(maxT).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const stroke = dark ? '#E9B565' : 'var(--brew-ink)';
  const fill = dark ? 'rgba(233,181,101,.14)' : 'color-mix(in srgb, var(--brew) 22%, transparent)';
  const grid = dark ? '#2E3934' : 'var(--line)';
  const ticks = [0, Math.round(maxT / 2 / 10) * 10, maxT];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="ck-curve" style={{ width: '100%', height: 'auto', display: 'block' }}>
      {[0, total / 2, total].map((w, i) => <g key={i}><line x1={L} x2={W - R} y1={y(w)} y2={y(w)} stroke={grid} strokeWidth="1" strokeDasharray={i ? '3 3' : ''} /><text x={L - 5} y={y(w) + 3} textAnchor="end">{Math.round(w)}</text></g>)}
      {ticks.map((s, i) => <text key={i} x={x(s)} y={H - 6} textAnchor={i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}>{fmtClock(s)}</text>)}
      <path d={area} fill={fill} stroke="none" />
      <path d={line} fill="none" stroke={stroke} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round" />
      {elapsed > 0 && <g><line x1={x(Math.min(elapsed, maxT))} x2={x(Math.min(elapsed, maxT))} y1={T} y2={H - B} stroke={dark ? '#fff' : 'var(--ink)'} strokeWidth="1.2" strokeDasharray="3 3" /></g>}
    </svg>);
}

function DrinkChips({ drink, setDrink, t, box }) {
  return (
    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
      {[['all', t('filter_all')], ['hot', t('filter_hot')], ['iced', t('filter_iced')]].map(([k, lb]) =>
      <button key={k} className={`ck-chip ${box ? 'box' : ''} ${drink === k ? 'on' : ''}`} onClick={() => setDrink(k)}>
          {k === 'hot' && <Flame size={14} />}{k === 'iced' && <Snowflake size={14} />}{lb}
        </button>)}
    </div>);
}

// 手機：濾杯篩選抽屜（草稿 → 按「顯示 N 個配方」才套用）
function FilterSheet({ dinfo, counts, sel, gear, onApply, onClose, t, recipesFor, openSettings }) {
  const [draft, setDraft] = useState(sel);
  const toggle = (id) => setDraft((v) => v.includes(id) ? v.filter((x) => x !== id) : [...v, id]);
  const n = recipesFor(draft);
  const allIds = Object.keys(dinfo.byId).filter((id) => counts[id]);
  const isMine = gear.length > 0 && draft.length === gear.length && gear.every((g) => draft.includes(g));
  return ReactDOM.createPortal(
    <React.Fragment>
      <div className="ck-scrim" onClick={onClose}></div>
      <div className="ck-sheet" role="dialog" aria-label={t('pick_drippers')}>
        <div className="grab"></div>
        <div className="ck-sheet-h"><h2>{t('pick_drippers')}</h2><button className="ck-cap act" style={{ margin: 0 }} onClick={() => setDraft([])}>{t('clear')}</button></div>
        <div className="ck-sheet-b">
          <div style={{ display: 'flex', gap: 8, marginBottom: 6 }}>
            <button className={`ck-chip box ${isMine ? 'on' : ''}`} onClick={() => gear.length ? setDraft([...gear]) : openSettings('gear')}>{t('preset_mine')} <span className="ct">{gear.length}</span></button>
            <button className={`ck-chip box ${draft.length === 0 ? 'on' : ''}`} onClick={() => setDraft([])}>{t('preset_all')} <span className="ct">{allIds.length}</span></button>
          </div>
          {gear.length === 0 && <p style={{ fontSize: 12.5, color: 'var(--mute)', margin: '6px 2px 0' }}>{t('no_gear_set')}</p>}
          {dinfo.cats.map((cat) => {
            const items = cat.items.filter((d) => counts[d.id]);
            if (!items.length) return null;
            return (
              <div key={cat.label}>
                <div className="ck-cap" style={{ marginTop: 16, marginBottom: 4 }}><span className={`ck-dot ${cat.cat}`}></span>{cat.label}</div>
                {items.map((d) => <CheckRow key={d.id} on={draft.includes(d.id)} name={d.name} count={counts[d.id]} onClick={() => toggle(d.id)} />)}
              </div>);
          })}
        </div>
        <div className="ck-sheet-f"><button className="ck-btn dark block" onClick={() => onApply(draft)}>{fmt(t('show_n'), { n })}</button></div>
      </div>
    </React.Fragment>, document.body);
}

// ---------- 沖煮首頁（清單） ----------
const BREW_UI = { q: '', open: {}, list: null, dose: null, pushed: false }; // 回到清單時保留搜尋字與展開狀態
function BrewHome({ t, lang, db, store, onOpen, openSettings }) {
  const { DRIPPER_CATEGORIES, RECIPE_DATABASE } = db;
  const dinfo = useDripperInfo(DRIPPER_CATEGORIES, lang);
  const isDesktop = useIsDesktop();
  const isWide = useMedia('(min-width: 768px)');
  const { favs, toggleFav, recent, gear, setupDone, setSetupDone } = store;
  const [q, setQ0] = useState(BREW_UI.q);
  const setQ = (v) => { BREW_UI.q = v; setQ0(v); };
  const [drink, setDrink] = useStored('coffee_brew_drink', 'all');
  const [selRaw, setSel] = useStored('coffee_brew_sel', null);
  const [sheet, setSheet] = useState(false);
  const [openMap, setOpenMap0] = useState(BREW_UI.open);
  const setOpenMap = (fn) => setOpenMap0((m) => { const v = typeof fn === 'function' ? fn(m) : fn; BREW_UI.open = v; return v; });
  const byId = useMemo(() => { const m = {}; RECIPE_DATABASE.forEach((r) => { m[r.id] = r; }); return m; }, [RECIPE_DATABASE]);
  const sel = (selRaw === null ? gear : selRaw).filter((id) => dinfo.byId[id]);
  const drinkOk = (r) => drink === 'all' || (drink === 'iced' ? r.drinkType === 'iced' : r.drinkType !== 'iced');
  const query = q.trim().toLowerCase();
  const textOk = (r) => !query || [r.name, r.author, dinfo.byId[r.dripper] && dinfo.byId[r.dripper].name, recipeText(r)].filter(Boolean).join(' ').toLowerCase().includes(query);
  const counts = useMemo(() => { const m = {}; RECIPE_DATABASE.forEach((r) => { if (drinkOk(r)) m[r.dripper] = (m[r.dripper] || 0) + 1; }); return m; }, [RECIPE_DATABASE, drink]);
  const recipesFor = (s) => RECIPE_DATABASE.filter((r) => drinkOk(r) && (s.length === 0 || s.includes(r.dripper))).length;
  const filtered = RECIPE_DATABASE.filter((r) => drinkOk(r) && textOk(r) && (sel.length === 0 || sel.includes(r.dripper)));
  const elsewhere = query && sel.length ? RECIPE_DATABASE.filter((r) => drinkOk(r) && textOk(r)).length - filtered.length : 0;
  const totalDrink = RECIPE_DATABASE.filter(drinkOk).length;
  const groups = useMemo(() => {
    const out = [];
    dinfo.cats.forEach((cat) => cat.items.forEach((d) => {
      const items = filtered.filter((r) => r.dripper === d.id);
      if (items.length) out.push({ d, items });
    }));
    return out;
  }, [filtered, dinfo]);
  const flatIds = groups.flatMap((g) => g.items.map((r) => r.id));
  const defaultOpen = isWide || !!query || groups.length <= 2;
  const isOpen = (id) => openMap[id] != null ? openMap[id] : defaultOpen;
  const allOpen = groups.every((g) => isOpen(g.d.id));
  const setAll = (v) => { const m = {}; groups.forEach((g) => { m[g.d.id] = v; }); setOpenMap(m); };
  const toggleSel = (id) => setSel(sel.includes(id) ? sel.filter((x) => x !== id) : [...sel, id]);
  const onlyGearOn = gear.length > 0 && sel.length === gear.length && gear.every((g) => sel.includes(g));
  const recents = recent.filter((x) => byId[x.id]);
  const favList = favs.filter((id) => byId[id]);
  const firstUse = recents.length === 0 && favList.length === 0;
  const newest = NEW_RECIPE_IDS.map((id) => byId[id]).filter(Boolean).slice(0, isDesktop ? 4 : 3);
  const filterCount = sel.length;

  const searchBox = (placeholder) =>
  <div className="ck-input">
      <Search size={17} style={{ color: 'var(--faint)' }} />
      <input type="text" value={q} onChange={(e) => setQ(e.target.value)} placeholder={placeholder} aria-label={placeholder} enterKeyHint="search" />
      {q && <button className="ck-icb sm plain" style={{ width: 28, height: 28 }} onClick={() => setQ('')} aria-label="clear"><XIcon size={15} /></button>}
    </div>;

  const section = (title, icon, n, children, act) =>
  <section style={{ marginBottom: 26 }}>
      <div className="ck-cap">{icon}{title}{n != null && <span className="n">{n}</span>}{act}</div>
      {children}
    </section>;

  return (
    <div className="ck-brew">
      {/* 電腦版：左側濾杯篩選 */}
      <aside className="ck-side" aria-label={t('filter_title')}>
        <div className="ck-cap">{t('filter_title')}{sel.length > 0 && <button className="act" onClick={() => setSel([])}>{t('clear')}</button>}</div>
        <div style={{ margin: '2px 0 14px' }}><DrinkChips drink={drink} setDrink={setDrink} t={t} box /></div>
        <div className="ck-mygear">
          <span>{t('only_my_gear')}</span>
          <button className={`ck-sw ${onlyGearOn ? 'on' : ''}`} aria-pressed={onlyGearOn} aria-label={t('only_my_gear')} onClick={() => { if (!gear.length) { openSettings('gear'); return; } setSel(onlyGearOn ? [] : [...gear]); }}></button>
        </div>
        {gear.length === 0 && <button className="ck-more" style={{ fontSize: 12 }} onClick={() => openSettings('gear')}>{t('no_gear_set')} →</button>}
        {dinfo.cats.map((cat) =>
        <div key={cat.label}>
            <div className="grp"><span className={`ck-dot ${cat.cat}`}></span>{cat.label}</div>
            {cat.items.map((d) => <CheckRow key={d.id} on={sel.includes(d.id)} name={d.name} count={counts[d.id] || 0} dim={!counts[d.id]} onClick={() => toggleSel(d.id)} />)}
          </div>
        )}
      </aside>

      <div style={{ minWidth: 0 }}>
        {/* 電腦版標題＋搜尋 */}
        {isDesktop &&
        <div style={{ display: 'flex', alignItems: 'center', gap: 18, marginBottom: 22 }}>
            <h1 style={{ fontSize: 28, fontWeight: 800, letterSpacing: '-.02em', margin: 0, whiteSpace: 'nowrap' }}>{t('nav_brew')}</h1>
            <div style={{ flex: 1, maxWidth: 560 }}>{searchBox(t('search_short'))}</div>
          </div>
        }
        {/* 手機版：冷熱在上方 */}
        {!isDesktop && <div style={{ marginBottom: 14 }}><DrinkChips drink={drink} setDrink={setDrink} t={t} /></div>}

        {!query && firstUse && !setupDone && gear.length === 0 &&
        <div className="ck-setup" style={{ marginBottom: 20 }}>
            <div style={{ flex: 1, minWidth: 0 }}><b>{t('setup_q')}</b><small>{t('setup_sub')}</small></div>
            <button className="ck-btn sage" style={{ padding: '9px 14px', fontSize: 14 }} onClick={() => { setSetupDone(true); openSettings('gear'); }}>{t('setup_pick')}</button>
            <button className="ck-chip" onClick={() => setSetupDone(true)}>{t('setup_skip')}</button>
          </div>
        }
        {!query && firstUse && newest.length > 0 && section(t('newest'), null, null,
        <div className="ck-cards">{newest.map((r) => <RecipeCard key={r.id} r={r} d={dinfo.byId[r.dripper]} sub={r.author} fav={favs.includes(r.id)} onFav={toggleFav} onOpen={() => onOpen(r.id, newest.map((x) => x.id))} t={t} />)}</div>
        )}
        {!query && recents.length > 0 && section(t('recent'), <Clock size={14} />, null,
        <div className="ck-cards">{recents.slice(0, isDesktop ? 4 : 3).map((x) => { const r = byId[x.id]; return <RecipeCard key={x.id} r={r} d={dinfo.byId[r.dripper]} sub={relTime(x.at, t)} fav={favs.includes(r.id)} onFav={toggleFav} onOpen={() => onOpen(r.id, recents.map((y) => y.id), x.dose)} t={t} />; })}</div>
        )}
        {!query && favList.length > 0 && section(t('favs'), <span style={{ color: 'var(--heart)', display: 'inline-flex' }}><Heart on size={14} /></span>, favList.length,
        <div className="ck-cards">
            {favList.map((id) => { const r = byId[id]; return <RecipeCard key={id} r={r} d={dinfo.byId[r.dripper]} sub={r.author} fav onFav={toggleFav} onOpen={() => onOpen(id, favList)} t={t} />; })}
            {isDesktop && <div className="ck-empty">{t('fav_hint')}</div>}
          </div>
        )}

        {section(query ? t('search_results') : t('all_recipes'), null,
        `${t('showing')} ${filtered.length} / ${totalDrink} ${t('of_total')}`,
        <div>
            {elsewhere > 0 &&
          <div className="ck-setup" style={{ marginBottom: 10, padding: '10px 14px' }}>
                <div style={{ flex: 1, fontSize: 13.5, fontWeight: 700, color: 'var(--sage-d)' }}>{fmt(t('found_elsewhere'), { n: elsewhere })}</div>
                <button className="ck-chip box" onClick={() => setSel([])}>{t('show_them')}</button>
              </div>
          }
            {groups.length === 0 &&
          <div className="ck-empty" style={{ flexDirection: 'column', padding: 28 }}>
                {query ? t('search_no_result') : t('no_filter_match')}
                {(sel.length > 0 || drink !== 'all') && <button className="ck-chip box" onClick={() => { setSel([]); setDrink('all'); }}>{t('reset_filter')}</button>}
              </div>
          }
            {groups.map(({ d, items }) => {
            const open = isOpen(d.id);
            return (
              <div key={d.id} className={`ck-grp ${open ? 'open' : ''}`}>
                  <button className="ck-grp-h" aria-expanded={open} onClick={() => setOpenMap((m) => ({ ...m, [d.id]: !open }))}>
                    <span className={`ck-dot ${d.cat}`}></span>{d.name}<span className="ct num">{items.length}</span><ChevronDown size={18} className="chev" />
                  </button>
                  {open && items.map((r) => <RecipeRow key={r.id} r={r} t={t} fav={favs.includes(r.id)} onFav={toggleFav} onOpen={() => onOpen(r.id, flatIds)} />)}
                </div>);
          })}
          </div>,
        groups.length > 2 && !isWide ? <button className="act" onClick={() => setAll(!allOpen)}>{allOpen ? t('collapse_all') : t('expand_all')}</button> : null
        )}
      </div>

      {/* 手機版：搜尋＋濾杯按鈕在拇指區 */}
      {!isDesktop &&
      <div className="ck-pbar">
          {searchBox(t('search_mobile'))}
          <button className="ck-fbtn" onClick={() => setSheet(true)}><Filter size={16} />{t('filter_title')}{filterCount > 0 && <span className="n num">{filterCount}</span>}<ChevronDown size={15} /></button>
        </div>
      }
      {sheet && <FilterSheet dinfo={dinfo} counts={counts} sel={sel} gear={gear} t={t} recipesFor={recipesFor} openSettings={(s) => { setSheet(false); openSettings(s); }} onClose={() => setSheet(false)} onApply={(v) => { setSel(v); setSheet(false); setOpenMap({}); }} />}
    </div>);
}

// ---------- 沖煮模式（深色全螢幕） ----------
function BrewMode({ recipe, dinfo, ratio, total, plan, starts, tm, t, onExit, onSummary }) {
  const isIced = recipe.drinkType === 'iced';
  const n = recipe.steps.length;
  const idx = tm.activeStepIndex;
  const cur = Math.max(0, idx);
  const step = recipe.steps[cur];
  const rt = (x) => typeof x === 'function' ? x(ratio) : x;
  const endSec = Math.max(starts[n - 1] || 0, parseRangeEnd(recipe.steps[n - 1].time) || 0);
  const done = idx === n - 1 && tm.elapsed >= starts[n - 1] && tm.elapsed > 0;
  const exp = expectedWater(plan, cur, tm.elapsed);
  const tgt = plan[cur] ? plan[cur].target : 0;
  const nextStep = cur < n - 1 ? recipe.steps[cur + 1] : null;
  const pct = (w) => total ? Math.min(100, (w / total) * 100) : 0;
  const exitRef = useRef(onExit); exitRef.current = onExit;
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') exitRef.current(); };
    window.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, []);
  const stepList =
  <div>
      {recipe.steps.map((s, i) =>
    <div key={i} className={`ck-bm-st ${i === idx ? 'on' : i < idx ? 'done' : ''}`}>
          <span className="d"></span>
          <div className="t">{s.action ? `${s.action}・` : ''}{rt(s.note)}<small>{s.time}</small></div>
          {s.water != null && <span className="w">{Math.round(s.water * ratio)}g</span>}
        </div>
    )}
    </div>;
  return ReactDOM.createPortal(
    <div className="ck-bm" role="dialog" aria-label={t('start_brew')}>
      <div className="ck-bm-top">
        <button className="x" onClick={onExit} aria-label={t('exit')}><XIcon size={18} /></button>
        <div className="tt"><b>{recipe.name}</b><small>{fmt(t('step_of'), { i: cur + 1, n })}{dinfo ? ` · ${dinfo.short}` : ''}</small></div>
        <button className="x" onClick={() => tm.setSoundOn((v) => !v)} aria-label={t('sound_toggle')} title={t('sound_toggle')}>{tm.soundOn ? <Bell size={17} /> : <BellOff size={17} />}</button>
        {tm.elapsed > 0 && <button className="x" onClick={onSummary} aria-label={t('summary_btn')} title={t('summary_btn')}><CheckCircle2 size={18} /></button>}
      </div>
      <div className="ck-bm-body">
        <div className="ck-bm-l">
          <div className="ck-timer">{fmtTimer(tm.elapsed)}</div>
          <div className="ck-tmeta">
            {tm.nextStepIn != null && <span>{t('next_up')}<b>{fmtClock(tm.nextStepIn)}</b></span>}
            <span>{t('est_finish')}<b>{fmtClock(endSec)}</b></span>
            <span>{t('total_water')}<b>{Math.round(total)}g</b></span>
          </div>
          <div className="ck-now">
            {done ?
            <div className="ck-bm-done"><Coffee size={30} style={{ margin: '0 auto 10px', color: '#E9B565' }} /><b>{t('brew_done')}</b>
                <button className="ck-btn" style={{ marginTop: 16, background: '#fff', color: '#111513' }} onClick={onSummary}><CheckCircle2 size={17} />{t('summary_btn')}</button>
              </div> :
            <React.Fragment>
                {step.action && <span className={`ac ${isIced ? 'ice' : ''}`}>{step.action}</span>}
                <div className="nt">{rt(step.note)}</div>
                {(tgt > 0) &&
              <React.Fragment>
                    <div className="ck-gauge"><b className={isIced ? 'ice' : ''}>{Math.round(idx < 0 ? 0 : exp)}</b><span>/ {Math.round(tgt)} g · {plan[cur].pour ? t('now_water') : t('hold_water')}</span></div>
                    <div className="ck-gbar"><i className={isIced ? 'ice' : ''} style={{ width: `${pct(idx < 0 ? 0 : exp)}%` }}></i><u style={{ left: `${pct(tgt)}%` }}></u></div>
                  </React.Fragment>
              }
              </React.Fragment>
            }
          </div>
          {nextStep && !done &&
          <div className="ck-nextc">
              <div className="l"><small>{t('next_up')} · {nextStep.time}</small><b>{nextStep.action ? `${nextStep.action}・` : ''}{rt(nextStep.note)}</b></div>
              {tm.nextStepIn != null && <span className={`in ${tm.nextStepIn <= 5 ? 'soon' : ''}`}>{fmtClock(tm.nextStepIn)}</span>}
            </div>
          }
          <div className="ck-bm-ctl">
            <button className={`pri ${tm.isRunning ? '' : 'go'}`} onClick={tm.toggle}>{tm.isRunning ? <React.Fragment><Pause size={20} />{t('pause')}</React.Fragment> : <React.Fragment><Play size={20} />{tm.elapsed > 0 ? t('resume') : t('start_brew')}</React.Fragment>}</button>
            {cur < n - 1 && <button onClick={tm.jumpNext} aria-label={t('next_short')}><SkipFwd size={18} /><span className="hidden sm:inline">{t('next_short')}</span></button>}
            <button className="ic" onClick={tm.reset} aria-label={t('reset')} title={t('reset')}><RotateCcw size={19} /></button>
          </div>
        </div>
        <div className="ck-bm-r">
          <div className="ck-cap" style={{ color: '#9AA6A0' }}>{t('brew_steps')}</div>
          {stepList}
          <div className="ck-cap" style={{ color: '#9AA6A0', marginTop: 18 }}>{t('pour_curve')}</div>
          <div style={{ background: '#1B2220', border: '1px solid #2E3934', borderRadius: 16, padding: 10 }}>
            <PourCurve plan={plan} total={total} endSec={endSec} elapsed={tm.elapsed} dark />
          </div>
        </div>
      </div>
    </div>, document.body);
}


// 配方頁右側：研磨度（配方基準 → 換算成我的磨豆機；選擇會存成「我的磨豆機」）
function GrindCard({ recipe, GDB, myGrinder, setMyGrinder, t }) {
  const baseKey = recipe.baseGrind.grinder; const base = GDB[baseKey];
  const groups = useMemo(() => {
    const g = {}; Object.entries(GDB).forEach(([k, v]) => { (g[v.group] = g[v.group] || []).push({ k, name: v.name }); });
    Object.values(g).forEach((a) => a.sort((x, y) => x.name.localeCompare(y.name, undefined, { numeric: true, sensitivity: 'base' })));
    return g;
  }, [GDB]);
  if (!base) return null;
  const other = myGrinder && myGrinder !== baseKey && GDB[myGrinder];
  const conv = other ? convertGrind(GDB, baseKey, recipe.baseGrind.val, myGrinder) : null;
  return (
    <div className="ck-card ck-rail-c">
      <h3><Settings2 size={15} />{t('suggest_grind_title')}</h3>

      </div>
      <span className="ck-lab" style={{ margin: '12px 0 6px' }}>{t('my_grinder')}</span>
      <select className="ck-select" value={myGrinder || ''} onChange={(e) => setMyGrinder(e.target.value)} aria-label={t('my_grinder')}>
        <option value="">{t('select_grinder_placeholder')}</option>
        {Object.entries(groups).map(([g, arr]) => <optgroup key={g} label={g}>{arr.map((x) => <option key={x.k} value={x.k}>{x.name}</option>)}</optgroup>)}
      </select>
      {other &&
      <div style={{ marginTop: 10, borderRadius: 14, padding: '10px 14px', background: conv ? 'var(--grind-soft)' : 'var(--diag-soft)', color: conv ? 'var(--grind-ink)' : 'var(--diag-ink)' }}>
          {conv ?
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8 }}>
              <span style={{ fontSize: 12.5, fontWeight: 700 }}>{t('converted_result')}</span>

            </div> :
        <span style={{ fontSize: 13, fontWeight: 700 }}>{t('err_match')}</span>}
        </div>
      }
    </div>);
}

  const nextStepIn = useMemo(() => {

// ---------- 沖煮總管 ----------
function BrewTool({ lang, t, c, route, navigate, store, openSettings, initialDose }) {
  const db = useDatabases(lang);
  const recipe = route.recipe ? db.RECIPE_DATABASE.find((r) => r.id === route.recipe) : null;
  // 從首頁「最近沖過」點進來時，首頁會把清單與粉量放在 BREW_UI
  const [list, setList] = useState(() => { const l = BREW_UI.list; BREW_UI.list = null; return l || []; });
  const [doseHint, setDoseHint] = useState(() => { const d = BREW_UI.dose; BREW_UI.dose = null; return initialDose || d || null; });
  const fromList = useRef((() => { const v = BREW_UI.pushed; BREW_UI.pushed = false; return v; })());   // 從清單點進來 → 返回時用 history.back()，保留瀏覽紀錄乾淨
  const pushedGo = useRef(false);
  const listScroll = useRef(0);
  const open = (id, ids, dose) => { listScroll.current = window.scrollY; fromList.current = true; setList(ids && ids.length ? ids : [id]); setDoseHint(dose || null); navigate({ tool: 'brew', recipe: id }); };
  const rid = recipe ? recipe.id : null;
  useLayoutEffect(() => { window.scrollTo(0, rid ? 0 : listScroll.current); }, [rid]);
  if (recipe) {
    const ids = list.includes(recipe.id) ? list : db.RECIPE_DATABASE.filter((r) => r.dripper === recipe.dripper).map((r) => r.id);
    return <RecipePage key={recipe.id} recipe={recipe} db={db} t={t} c={c} lang={lang} store={store} list={ids} initialDose={doseHint}
    onNav={(id) => { setDoseHint(null); navigate({ tool: 'brew', recipe: id }, true); }}
    onBack={() => { if (fromList.current) { fromList.current = false; history.back(); } else navigate({ tool: 'brew' }, true); }}
    brewing={!!route.go} setBrewing={(v) => {
      if (v) { pushedGo.current = true; navigate({ tool: 'brew', recipe: recipe.id, go: true }); }
      else if (pushedGo.current) { pushedGo.current = false; history.back(); }
      else navigate({ tool: 'brew', recipe: recipe.id }, true);
    }} />;
  }
  return <BrewHome t={t} lang={lang} db={db} store={store} onOpen={open} openSettings={openSettings} />;
}
